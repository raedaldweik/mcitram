    request:
      description: >
        A request object is the root object contained in the body of requests for put and post endpoints. It specifies the destination of the resulting report as well as the operations to be performed on the report.
      properties:
        id:
          description: The ID of the request, usually a UUID.
          type: string
        version:
          description: This media type's schema version number.
          type: integer
        resultFolder:
          description: The URI of the folder in which to save the resulting report. If not specified and a new report is being created, the default value of "/reports/reports/@myFolder" is used.
          type: string
        resultReportName:
          description: The name of the resulting report. If not specified and a new report is being created, the default value of "Report" is used along with a resultNameConflict policy of "rename".
