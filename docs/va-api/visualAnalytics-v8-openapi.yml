openapi: 3.0.3
info:
  version: "8"
  title: Visual Analytics
  description: The Visual Analytics API provides simplified ways to perform basic tasks with reports. Tasks include exporting a report as a PDF file, or as a package file, or exporting an image of a part of the report.
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
tags:
  - name: Root
    description: Contains the operations for the root resource.
  - name: Export
    description: Contains the operations for immediate export of content.
  - name: Jobs
    description: Contains the operations used by clients for asynchronous execution.
  - name: Internal
    description: Contains the operations used only internally for asynchronous execution.
  - name: Report
    description: Contains the operations used by clients for manipulating a report.
paths:
  /:
    get:
      tags:
        - Root
      summary: Get a list of top-level links
      operationId: root
      description: Returns a list of link objects for some of the primary resources surfaced by this API. The list includes basic actions that are identified by their `relation` properties, such as printing a report, exporting a report package, exporting the data in a report, and so on See the example response for the list of expected links with their relation names, types and URIs.
      responses:
        "200":
          description: The request succeeded.
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/apiList"
              examples:
                default:
                  $ref: "#/components/examples/root"
                example-1:
                  value:
                    version: 1
                    links:
                      - rel: self
                        method: GET
                        type: application/vnd.sas.api
                        uri: /visualAnalytics
                        href: /visualAnalytics
                      - rel: printReport
                        method: GET
                        type: application/zip
                        uri: /visualAnalytics/reports/{reportId}/pdf
                        href: /visualAnalytics/reports/{reportId}/pdf
                      - rel: reportPackage
                        method: GET
                        type: application/zip
                        uri: /visualAnalytics/reports/{reportId}/package
                        href: /visualAnalytics/reports/{reportId}/package
                      - rel: reportImageSvg
                        method: GET
                        type: image/svg+xml
                        uri: /visualAnalytics/reports/{reportId}/svg
                        href: /visualAnalytics/reports/{reportId}/svg
                      - rel: reportImagePng
                        method: GET
                        type: image/png
                        uri: /visualAnalytics/reports/{reportId}/png
                        href: /visualAnalytics/reports/{reportId}/png
                      - rel: reportDataCsv
                        method: GET
                        type: text/csv
                        uri: /visualAnalytics/reports/{reportId}/csv
                        href: /visualAnalytics/reports/{reportId}/csv
                      - rel: exportPdf
                        method: POST
                        type: application/vnd.sas.visual.analytics.report.export.pdf.request
                        responseType: application/vnd.sas.visual.analytics.report.export.pdf.job
                        uri: /visualAnalytics/reports/{reportId}/exportPdf
                        href: /visualAnalytics/reports/{reportId}/exportPdf
            application/json:
              schema:
                $ref: "#/components/schemas/apiList"
              examples:
                default:
                  $ref: "#/components/examples/root"
          headers:
            Content-Type:
              description: Always returns "application/vnd.sas.api+json".
              schema:
                type: string
  "/reports/{reportId}/pdf":
    get:
      tags:
        - Export
      summary: Export a PDF of a report
      operationId: getExportedReportPdf
      description: Exports a report as PDF. Maintain the client connection to download the report even if it takes some time to generate the PDF. Apply the query parameter values to the creation of the PDF output, overriding (1) defaults of the underlying rendering services, and also overriding (2) any defaults that were saved with the report by the SAS Visual Analytics application.
      parameters:
        - $ref: "#/components/parameters/reportId"
        - $ref: "#/components/parameters/reportObjects"
        - $ref: "#/components/parameters/orientation"
        - $ref: "#/components/parameters/paperSize"
        - $ref: "#/components/parameters/margin"
        - $ref: "#/components/parameters/showPageNumbers"
        - $ref: "#/components/parameters/showEmptyRowsAndColumns"
        - $ref: "#/components/parameters/includeTableOfContents"
        - $ref: "#/components/parameters/includeAppendix"
        - $ref: "#/components/parameters/includeComments"
        - $ref: "#/components/parameters/includeDetailsTables"
        - $ref: "#/components/parameters/expandClippedContent"
        - $ref: "#/components/parameters/includeCoverPage"
        - $ref: "#/components/parameters/coverPageText"
        - $ref: "#/components/parameters/Accept-Language"
        - $ref: "#/components/parameters/Accept-Locale"
      responses:
        "200":
          description: Successful execution. Response is the report in the requested PDF format.
          content:
            application/pdf: {}
          headers:
            Last-Modified:
              description: Timestamp response was created.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Location:
              description: On success this header containers the URI of the generated PDF file.
              schema:
                type: string
        "303":
          $ref: "#/components/responses/jobContinuation"
        "400":
          $ref: "#/components/responses/errorInRequest"
        "404":
          description: No report exists at the requested path.
          content:
            aplication/json:
              schema:
                type: object
              examples:
                default:
                  $ref: "#/components/examples/export_error404"
  "/reports/{reportId}/svg":
    get:
      tags:
        - Export
      summary: Export an SVG image of report or report object
      operationId: getExportedReportImageSVG
      description: Exports an image for the report or part of a report in Scalable Vector Graphics format. The returned content is as specified by the Accept header of the request as "image/svg+xml".
      parameters:
        - $ref: "#/components/parameters/reportId"
        - $ref: "#/components/parameters/reportObjectForImage"
        - $ref: "#/components/parameters/imageSize"
        - $ref: "#/components/parameters/waitParameter"
        - $ref: "#/components/parameters/Accept-Language"
        - $ref: "#/components/parameters/Accept-Locale"
      responses:
        "200":
          description: The image been created and is returned as the response body.
          content:
            image/svg+xml:
              schema:
                type: string
              example: <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="268" height="151" viewBox="0 0 268 151"> </svg>
          headers:
            Location:
              description: Not normally provided.
              schema:
                type: string
            Last-Modified:
              description: Timestamp response was created.
              schema:
                type: string
                format: date-time
        "303":
          $ref: "#/components/responses/jobContinuation"
        "400":
          $ref: "#/components/responses/errorInRequest"
        "403":
          description: The user did not have the necessary permissions.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                authorizationDenied:
                  $ref: "#/components/examples/authorizationDenied"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                authorizationDenied:
                  $ref: "#/components/examples/authorizationDenied"
        "404":
          description: No report exists at the requested path.
          content:
            aplication/json:
              schema:
                type: object
              examples:
                default:
                  $ref: "#/components/examples/export_error404"
  "/reports/{reportId}/png":
    get:
      tags:
        - Export
      summary: Export a PNG image of a report or report object
      operationId: getExportedReportImagePNG
      description: Exports an image for the report or part of a report in Portable Network Graphics format. The returned content is as specified by the Accept header of the request as "image/png+xml".
      parameters:
        - $ref: "#/components/parameters/reportId"
        - $ref: "#/components/parameters/reportObjectForImage"
        - $ref: "#/components/parameters/imageSize"
        - $ref: "#/components/parameters/waitParameter"
        - $ref: "#/components/parameters/Accept-Language"
        - $ref: "#/components/parameters/Accept-Locale"
      responses:
        "200":
          description: The image been created and is returned as the response body.
          content:
            image/png: {}
          headers:
            Location:
              description: Not normally provided.
              schema:
                type: string
            Last-Modified:
              description: Timestamp response was created.
              schema:
                type: string
                format: date-time
        "303":
          $ref: "#/components/responses/jobContinuation"
        "400":
          $ref: "#/components/responses/errorInRequest"
        "403":
          description: The user did not have the necessary permissions.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                authorizationDenied:
                  $ref: "#/components/examples/authorizationDenied"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                authorizationDenied:
                  $ref: "#/components/examples/authorizationDenied"
        "404":
          description: No report exists at the requested path.
          content:
            aplication/json:
              schema:
                type: object
              examples:
                default:
                  $ref: "#/components/examples/export_error404"
  "/reports/{reportId}/package":
    get:
      tags:
        - Export
      summary: Export a report package
      operationId: getExportedReportPackage
      description: Exports a package for the report or report objects in compressed (zip) format. The returned content contains the report source files, plus the results of data queries and image rendering, constituting all that is needed for remote viewing of the report.
      parameters:
        - $ref: "#/components/parameters/reportId"
        - $ref: "#/components/parameters/reportObjects"
        - $ref: "#/components/parameters/Accept-Language"
        - $ref: "#/components/parameters/Accept-Locale"
      responses:
        "200":
          description: Successful execution. Response is the package in a compressed format.
          content:
            application/zip: {}
          headers:
            Last-Modified:
              description: Timestamp response was created.
              schema:
                type: string
                format: date-time
        "303":
          $ref: "#/components/responses/jobContinuation"
        "400":
          $ref: "#/components/responses/errorInRequest"
        "403":
          description: The user did not have the necessary permissions.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                authorizationDenied:
                  $ref: "#/components/examples/authorizationDenied"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                authorizationDenied:
                  $ref: "#/components/examples/authorizationDenied"
        "404":
          description: No request exists at the requested path.
          content:
            aplication/json:
              schema:
                type: object
              examples:
                default:
                  $ref: "#/components/examples/export_error404"
  "/reports/{reportId}/csv":
    get:
      tags:
        - Export
      summary: Export data for one object in a report as comma-separated values
      operationId: getExportedReportCSV
      description: Exports the data for a report object in the requested exported format (comma-separated values). The report object can be any table, graph or crosstab in the report.
      parameters:
        - name: reportId
          in: path
          description: Identifier of report resource.
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/reportObject"
        - $ref: "#/components/parameters/Accept-Language"
        - $ref: "#/components/parameters/Accept-Locale"
      responses:
        "200":
          description: Successful execution. Response is the data in CSV format.
          content:
            text/csv:
              schema:
                type: string
              examples:
                default:
                  $ref: "#/components/examples/export_data_get_csv"
          headers:
            Last-Modified:
              description: Timestamp response was created.
              schema:
                type: string
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                type: object
              examples:
                default:
                  $ref: "#/components/examples/get_export_data_400error"
        "403":
          description: The user did not have the necessary permissions.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                authorizationDenied:
                  $ref: "#/components/examples/authorizationDenied"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                authorizationDenied:
                  $ref: "#/components/examples/authorizationDenied"
        "404":
          description: No report exists at the requested path.
          content:
            aplication/json:
              schema:
                type: object
              examples:
                default:
                  $ref: "#/components/examples/export_error404"
  "/reports/{reportId}/tsv":
    get:
      tags:
        - Export
      summary: Export data for one object in a report as tab-separated values
      operationId: getExportedReportTSV
      description: Exports the data for a report object in the requested exported format (tab-separated values). The report object can be any table, graph or crosstab in the report.
      parameters:
        - name: reportId
          in: path
          description: Identifier of report resource.
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/reportObject"
        - $ref: "#/components/parameters/Accept-Language"
        - $ref: "#/components/parameters/Accept-Locale"
      responses:
        "200":
          description: Successful execution. Response is the data in the requested format.
          content:
            text/tsv:
              schema:
                type: string
              examples:
                default:
                  $ref: "#/components/examples/export_data_get_tsv"
          headers:
            Last-Modified:
              description: Timestamp response was created..
              schema:
                type: string
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                type: object
              examples:
                default:
                  $ref: "#/components/examples/get_export_data_400error"
        "403":
          description: The user did not have the necessary permissions.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                authorizationDenied:
                  $ref: "#/components/examples/authorizationDenied"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                authorizationDenied:
                  $ref: "#/components/examples/authorizationDenied"
        "404":
          description: No report exists at the requested path.
          content:
            aplication/json:
              schema:
                type: object
              examples:
                default:
                  $ref: "#/components/examples/export_error404"
  "/reports/{reportId}/xlsx":
    get:
      tags:
        - Export
      summary: Export data for one object in a report as an XLSX file
      operationId: getExportedReportWorksheet
      description: Exports the data for a report object in the requested exported format. The report object can be any table, graph or crosstab in the report.
      parameters:
        - name: reportId
          in: path
          description: Identifier of report resource.
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/reportObject"
        - $ref: "#/components/parameters/Accept-Language"
        - $ref: "#/components/parameters/Accept-Locale"
      responses:
        "200":
          description: Successful execution. Response is the document in the requested format.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          headers:
            Last-Modified:
              description: Timestamp response was created.
              schema:
                type: string
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                type: object
              examples:
                default:
                  $ref: "#/components/examples/get_export_data_400error"
        "403":
          description: The user did not have the necessary permissions.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                authorizationDenied:
                  $ref: "#/components/examples/authorizationDenied"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                authorizationDenied:
                  $ref: "#/components/examples/authorizationDenied"
        "404":
          description: No report exists at the requested path.
          content:
            aplication/json:
              schema:
                type: object
              examples:
                default:
                  $ref: "#/components/examples/export_error404"
  "/reports/{reportId}/summary":
    get:
      tags:
        - Export
      summary: Export a report summary
      description: Export a report summary, returning empty string for the common case where there is no summary
      operationId: getReportSummary
      parameters:
        - $ref: "#/components/parameters/reportId"
        - $ref: "#/components/parameters/Accept-Language"
        - $ref: "#/components/parameters/Accept-Locale"
      responses:
        "200":
          description: The report summary is returned, it might be an empty string
          headers:
            Content-Type:
              description: The content type of the response, `text/plain`.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
              examples:
                reportSummary:
                  $ref: "#/components/examples/reportSummary"
        "400":
          description: Bad request error.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidReportId:
                  $ref: "#/components/examples/invalidReportId"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                invalidReportId:
                  $ref: "#/components/examples/invalidReportId"
          headers:
            Content-Type:
              schema:
                type: string
  "/reports/{reportId}/exportPackage":
    post:
      tags:
        - Jobs
      summary: Create and run an action to export a report as a package file
      operationId: createExportPackageJob
      description: Starts a job from the request information that creates and exports the report as a package file. This starts the process of creating a package, but returns quickly. If the result is not ready by the time of the response, the client must poll until completion and then download the ZIP file. By default, only the user who created the package is authorized to retrieve it. For packages saved to a folder, the authorizations are controlled by the folder. Note that the /SASVisualAnalyticsCommon_capabilities/exportPackage capability is enforced on this operation. There is no support for creating a package with a back-level version; that is, the created package has the service's current version of package file.
      parameters:
        - $ref: "#/components/parameters/reportId"
        - $ref: "#/components/parameters/Accept-Language"
        - $ref: "#/components/parameters/Accept-Locale"
      requestBody:
        content:
          application/vnd.sas.visual.analytics.report.export.package.request+json:
            schema:
              $ref: "#/components/schemas/exportPackageRequest"
            examples:
              default:
                $ref: "#/components/examples/export_package_request"
          application/json:
            schema:
              $ref: "#/components/schemas/exportPackageRequest"
            examples:
              default:
                $ref: "#/components/examples/export_package_request"
      responses:
        "201":
          description: The job ran and completed within the wait time allotted. The response body contains links to the job object, which contains information about result output.
          headers:
            Content-Type:
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/vnd.sas.visual.analytics.report.export.package.job+json:
              schema:
                $ref: "#/components/schemas/exportPackageJob"
              examples:
                default:
                  $ref: "#/components/examples/completed_export_package_job"
            application/json:
              schema:
                $ref: "#/components/schemas/exportPackageJob"
              examples:
                default:
                  $ref: "#/components/examples/completed_export_package_job"
        "202":
          description: The job has been created. The response body contains links to requery for results and status of the job. This is expected to be the most usual case.
          headers:
            Content-Type:
              schema:
                type: string
            Location:
              description: The same value as the self link URI.
              schema:
                type: string
          content:
            application/vnd.sas.visual.analytics.report.export.package.job+json:
              schema:
                $ref: "#/components/schemas/exportPackageJob"
              examples:
                default:
                  $ref: "#/components/examples/running_export_package_job"
        "400":
          $ref: "#/components/responses/errorInRequest"
        "403":
          description: The user did not have the necessary permissions.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                authorizationDenied:
                  $ref: "#/components/examples/authorizationDenied"
            application/json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                authorizationDenied:
                  $ref: "#/components/examples/authorizationDenied"
  "/reports/{reportId}/exportPdf":
    post:
      tags:
        - Jobs
      summary: Create and run an action to export a report as a PDF file
      operationId: createExportPdfJob
      description: Starts a job from the request information that creates and exports the report as a PDF file. Apply the rendering option values in the request object to the creation of the PDF output. The request's options override (1) any defaults of the underlying rendering services, and (2) any defaults that were saved with the report by the SAS Visual Analytics application.
      parameters:
        - $ref: "#/components/parameters/reportId"
        - $ref: "#/components/parameters/Accept-Language"
        - $ref: "#/components/parameters/Accept-Locale"
      requestBody:
        content:
          application/vnd.sas.visual.analytics.report.export.pdf.request+json:
            schema:
              $ref: "#/components/schemas/exportPdfRequest"
            examples:
              default:
                $ref: "#/components/examples/export_pdf_request"
          application/json:
            schema:
              $ref: "#/components/schemas/exportPdfRequest"
            examples:
              default:
                $ref: "#/components/examples/export_pdf_request"
      responses:
        "201":
          description: The job ran and completed within the wait time allotted. The response body contains links to the job object, which contains information about result output.
          headers:
            Content-Type:
              schema:
                type: string
            Location:
              description: If the job completed with the wait time, the Location header contains the actual result file's URI.
              schema:
                type: string
          content:
            application/vnd.sas.visual.analytics.report.export.pdf.job+json:
              schema:
                $ref: "#/components/schemas/exportPdfJob"
              examples:
                default:
                  $ref: "#/components/examples/completed_export_pdf_job"
            application/json:
              schema:
                $ref: "#/components/schemas/exportPdfJob"
              examples:
                default:
                  $ref: "#/components/examples/completed_export_pdf_job"
        "202":
          description: The job has been created. The response body contains links to requery for results and status of the job. This is expected to be the most usual case.
          headers:
            Content-Type:
              schema:
                type: string
            Location:
              description: The same as the self link URI.
              schema:
                type: string
          content:
            application/vnd.sas.visual.analytics.report.export.pdf.job+json:
              schema:
                $ref: "#/components/schemas/exportPdfJob"
              examples:
                default:
                  $ref: "#/components/examples/running_export_pdf_job"
            application/json:
              schema:
                $ref: "#/components/schemas/exportPdfJob"
              examples:
                default:
                  $ref: "#/components/examples/running_export_pdf_job"
        "400":
          $ref: "#/components/responses/errorInRequest"
  "/reports/{reportId}/exportImage":
    post:
      tags:
        - Jobs
      summary: Create and run an action to export an image file
      operationId: createExportImageJob
      description: Starts a job from the request information that creates and exports the image as an SVG file or a PNG file.
      parameters:
        - $ref: "#/components/parameters/reportId"
        - $ref: "#/components/parameters/Accept-Language"
        - $ref: "#/components/parameters/Accept-Locale"
      requestBody:
        content:
          application/vnd.sas.visual.analytics.report.export.image.request+json:
            schema:
              $ref: "#/components/schemas/exportImageRequest"
            examples:
              default:
                $ref: "#/components/examples/export_image_default_request"
          application/json:
            schema:
              $ref: "#/components/schemas/exportImageRequest"
            examples:
              default:
                $ref: "#/components/examples/export_image_default_request"
      responses:
        "201":
          description: The job ran and completed within the wait time allotted. The response body contains links to the job object, which contains information about result output.
          headers:
            Content-Type:
              schema:
                type: string
            Location:
              description: If the job completed with the wait time, the Location header contains the actual result file's URI.
              schema:
                type: string
          content:
            application/vnd.sas.visual.analytics.report.export.image.job+json:
              schema:
                $ref: "#/components/schemas/exportImageJob"
              examples:
                default:
                  $ref: "#/components/examples/completed_export_image_job"
            application/json:
              schema:
                $ref: "#/components/schemas/exportImageJob"
              examples:
                default:
                  $ref: "#/components/examples/completed_export_image_job"
        "202":
          description: The job has been created. The response body contains links to requery for results and status of the job. This is expected to be the most usual case.
          headers:
            Content-Type:
              schema:
                type: string
            Location:
              description: The same as the self link URI.
              schema:
                type: string
          content:
            application/vnd.sas.visual.analytics.report.export.image.job+json:
              schema:
                $ref: "#/components/schemas/exportImageJob"
              examples:
                default:
                  $ref: "#/components/examples/running_export_image_job"
            application/json:
              schema:
                $ref: "#/components/schemas/exportImageJob"
              examples:
                default:
                  $ref: "#/components/examples/running_export_image_job"
        "400":
          $ref: "#/components/responses/errorInRequest"
        "403":
          description: The user did not have the necessary permissions.
