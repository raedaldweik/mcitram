        resultNameConflict:
          description: The name conflict resolution strategy. If not specified, the default behavior of "abort" is used when updating a report and the default behavior of "rename" is used when creating a new report.
          type: string
          enum:
            - abort
            - rename
            - replace
        operations:
          type: array
          items:
            $ref: "#/components/schemas/operation"
