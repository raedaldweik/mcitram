      description: Representation of a change data operation on a request.
      type: object
      required:
        - originalData
        - replacementData
      properties:
        originalData:
          description: The original data on the report to be changed.
          type: object
          properties:
            cas:
              $ref: "#/components/schemas/casObject"
        replacementData:
          description: The replacement data for the report.
          type: object
          properties:
            cas:
              $ref: "#/components/schemas/casObject"
        forceReplace:
          description: When the replacement data is tested for compatibility and errors occur, the operation can either fail or attempt to continue. This property can be used to force the change even if errors are found.
          type: boolean
        replacementLabel:
          description: A new label for the data source.
          type: string
        replacementDataItems:
          description: Replacement names for individual data items when mapping data. For a data item to be replaced, exactly one of the original name or original column is required. If both are specified, it is not an error, but the behavior is at the discretion of the operation.
          type: array
          items:
            description: The array of data item mapping information.
            type: object
            required:
              - replacementColumn
            properties:
              replacementColumn:
                description: The column name of the replacement column.
                type: string
              originalColumn:
                description: The column name of the original data to be replaced.
                type: string
              originalName:
                description: The unique name of the original data to be replaced.
                type: string
