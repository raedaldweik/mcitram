          headers:
            Content-Type:
              schema:
                type: string
            Location:
              description: Provided if meaningful, such as when the job is complete and results are available.
              schema:
                type: string
            Last-Modified:
              description: Timestamp response was created.
              schema:
                type: string
          content:
            application/vnd.sas.visual.analytics.report.export.pdf.job+json:
              schema:
                $ref: "#/components/schemas/exportPdfJob"
              examples:
                default:
                  $ref: "#/components/examples/completed_export_pdf_job"
            application/vnd.sas.visual.analytics.report.export.package.job+json:
              schema:
                $ref: "#/components/schemas/exportPackageJob"
              examples:
                default:
                  $ref: "#/components/examples/export_package_job200"
            application/vnd.sas.visual.analytics.report.export.image.job+json:
              schema:
                $ref: "#/components/schemas/exportImageJob"
              examples:
                default:
                  $ref: "#/components/examples/completed_export_image_job"
            application/vnd.sas.visual.analytics.report.export.data.job+json:
              schema:
                $ref: "#/components/schemas/exportDataJob"
              examples:
                default:
                  $ref: "#/components/examples/completed_export_data_job"
            application/json:
              schema:
                $ref: "#/components/schemas/exportPdfJob"
              examples:
                default:
                  $ref: "#/components/examples/completed_export_pdf_job"
        "400":
          $ref: "#/components/responses/errorInRequest"
        "404":
          description: No job exists at the requested path.
          content:
            aplication/json:
              schema:
                type: object
              examples:
                default:
                  $ref: "#/components/examples/export_error404"
    delete:
      operationId: deleteJobStatus
      tags:
        - Jobs
      summary: Delete the job with its status and link to results
      description: Deletes the job information. This operation is specific to the case of asynchronous execution of a report action job. If the job is still running, attempt to cancel it. This does not attempt to delete result files that reside under control of other services.
      parameters:
        - name: jobId
          in: path
          description: The identifier of an existing job.
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Successfully deleted. Nothing to be returned.
          headers:
            Location:
              description: Provided if meaningful.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/errorInRequest"
        "404":
          description: No job exists at the requested path.
          content:
            aplication/json:
              schema:
                type: object
              examples:
                default:
                  $ref: "#/components/examples/export_error404"
servers:
  - url: http://example.com/visualAnalytics
    description: The base URL for the service.
components:
  responses:
    errorInRequest:
      description: There was an error in the request.
      headers:
        Content-Type:
          description: Usually application/vnd.sas.error+json.
          schema:
            type: string
        Location:
          description: Provided if a location would be meaningful in the error context.
          schema:
            type: string
        Last-Modified:
          description: Timestamp response was created.
          schema:
            type: string
      content:
        application/vnd.sas.error+json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            default:
              $ref: "#/components/examples/error2"
        application/json:
          schema:
            $ref: "#/components/schemas/error2"
          examples:
            default:
              $ref: "#/components/examples/error2"
    jobContinuation:
      description: The operation could not be completed before the wait period expired. This redirect (See Other) continues the process of waiting for the result. It is used to provide liveness to the browser transmit queue. Note that although this practice of redirecting is common, clients that cannot follow a redirect must either not use this method or specify a longer `wait` period.
      content:
        application/json:
          schema:
            type: string
          example: The operation could not be completed before the wait period expired.
      headers:
        Location:
          description: A URI back to this service to wait for a pending result.
          schema:
            type: string
        Last-Modified:
          description: Timestamp response was created.
          schema:
            type: string
  parameters:
    reportId:
      name: reportId
      in: path
      description: Identifier of an existing report resource. Report identifiers are generated by the Reports API when reports are created.
      required: true
      schema:
        type: string
      example: 12345678-abcd-ef12-3456-123456789abc
    reportObjects:
      name: reportObjects
      in: query
      required: false
      description: This parameter lists the labels of the report objects to include in the request. Multiple object labels are separated by commas. The labels can be quoted to avoid problems with spaces and special characters. If this is left empty, the result varies depending on the type of output. Report objects include visual elements like graphs, tables, and visual containers that the author has created in the layout, as well as complete pages. Specifying the object by its label makes it more convenient for the report author or viewer and does not to expose the internal names of objects in the model. However, if the client knows the internal identifier of a report object, it can be used instead of the label.
      schema:
        type: string
      example: Bar+Chart+1,Cluster+Detail+Table
    reportObjectForImage:
      name: reportObject
      in: query
      required: false
      description: The name of the report object to render in the image. If this is left empty, the image is a representative output from the first page of the report. Report objects include visual elements like graphs, tables, and visual containers that the author has created in the layout, as well as complete pages. Specifying the object by its label makes it more convenient for the report author or viewer and does not to expose the internal names of objects in the model. However, if the client knows the internal identifier of a report object, it can be used instead of the label.
      schema:
        type: string
      example: Bar+Chart+1
    reportObject:
      name: reportObject
      in: query
      required: true
      description: The name of the report object as shown in the VA user interface. Report objects include visual elements like graphs, tables, and visual containers that the author has created in the layout, as well as complete pages. Specifying the object by its label makes it more convenient for the report author or viewer and does not to expose the internal names of objects in the model. However, if the client knows the internal identifier of a report object, it can be used instead of the label.
      schema:
        type: string
      example: Bar+Chart+1
    waitParameter:
      name: wait
      in: query
      required: false
      description: The number of seconds to wait for an update before returning from the "long poll". After this duration has passed, the API returns an HTTP status of 303 to the client with a redirect back to the service so that polling can continue. A system-imposed limit might reduce this requested value. It ranges from 1-60, default to 30.
      schema:
        type: integer
        default: 30
    orientation:
      name: orientation
      in: query
      schema:
        type: string
        enum:
          - landscape
          - portrait
        default: landscape
      description: The page orientation. If this query parameter is set, it overrides any orientation that is saved in the report by the Visual Analytics UI and the default value defined by other supporting services.
    paperSize:
      name: paperSize
      in: query
      schema:
        type: string
        enum:
          - letter
          - legal
          - A3
          - A4
          - A5
          - B4
          - B5
          - ledger
        default: letter
      description: The paper size designation from the enumerated list. Custom sizes are not provided in version 1. If this query parameter is set, it overrides any paperSize that is saved in the report by the Visual Analytics UI and the default value defined by other supporting services.
    margin:
      name: margin
      in: query
      schema:
        $ref: "#/components/schemas/margin"
      description: "A margin value that is applied to all four margins of the page. It is nonnegative number, integer, or floating point, which is followed by the unit. The unit can be one of the following two-letter abbreviations: in, cm, mm, pt , px , em, or ex."
      examples:
        inches:
          value: 1.25in
        centimeters:
          value: 2.5cm
        integerAllowed:
          value: 25mm
    includeTableOfContents:
      name: includeTableOfContents
      in: query
      schema:
        type: boolean
        default: false
      description: Indicates whether to add a table of contents.
    showPageNumbers:
      name: showPageNumbers
      in: query
      schema:
        type: boolean
        default: true
      description: Indicates whether page numbers should be displayed.
    showEmptyRowsAndColumns:
      name: showEmptyRowsAndColumns
      in: query
      schema:
        type: boolean
        default: false
      description: Indicates whether empty rows and columns should be included to fill the allocated layout space for list tables and crosstabs.
    includeAppendix:
      name: includeAppendix
      in: query
      schema:
        type: boolean
        default: true
      description: Indicates whether the appendix should be included. The appendix can contain comments, detail tables, and parts that were clipped in the main body of the report.
    includeComments:
      name: includeComments
      in: query
      schema:
        type: boolean
        default: false
      description: Indicates whether the comments should be included in the appendix.
    includeDetailsTables:
      name: includeDetailsTables
      in: query
      schema:
        type: boolean
        default: false
      description: Indicates whether the detail tables should be included in the appendix.
    expandClippedContent:
      name: expandClippedContent
      in: query
      schema:
        type: boolean
        default: false
      description: Enables you to see all of the content for tables, crosstabs, gauges, and containers. This includes content that is only partially available in the layout of the page. Each object is displayed on a separate page at the end of the report.
    includeCoverPage:
      name: includeCoverPage
      in: query
      schema:
        type: boolean
        default: true
      description: Indicates whether a cover page should be included. The cover page can include the name of the report, the date, the user name, and the number of pages.
    coverPageText:
      name: coverPageText
      in: query
      schema:
        type: string
        default: ""
      description: Optional text to be included on the cover page. This setting is ignored if includeCoverPage is false.
    imageSize:
      name: size
      in: query
      required: true
      description: Size of the resulting image in the form "9999px,9999px", where the horizontal dimension is before the comma and the vertical dimension is afterward. The two characters after the digits are reserved for unit specifiers; for example, "1024px,768px". The only units currently supported are pixels ("px") but the unit must be specified. This parameter must be specified.
      schema:
        type: string
        pattern: /[0-9]{2,6}px[\,][0-9]{2,6}px/
    Accept-Language:
      name: Accept-Language
      in: header
      description: The user's language, which is used in both rendering and caching. For technical details, see [section 5.3.5 of RFC 7231](https://tools.ietf.org/html/rfc7231#section-5.3.5). It affects the language of reports if they have been translated. This setting overrides any other user preference that has been set, such as the "offline process locale" preference in Visual Analytics. If this header is not set and there is no user preference, the language is the default language of the service.
      required: false
      schema:
        type: string
    Accept-Locale:
      name: Accept-Locale
      in: header
      description: A "format locale" that is distinct from the user's language (Accept-Language). Its syntax is similar to Accept-Language. It is honored in running of queries and formatting of values. This setting overrides any other user preference that has been set, such as the "regional locale for formats" preference in Visual Analytics. If this header is not set and there is no user preference, the format locale is the default locale of the service.
      required: false
      allowEmptyValue: true
      schema:
        type: string
    Accept-Item:
      name: Accept-Item
      in: header
      description: The requested media type of the entries in a response collection.
      required: false
      allowEmptyValue: false
      schema:
        type: string
  schemas:
    margin:
      type: string
      default: .25in
      description: A margin value that is applied to all four margins of the page. It is nonnegative number, integer, or floating point, which is followed by the unit. The unit can be one of several two-letter abbreviations, such as "in", "cm", "mm", "pt", "px", "em", and "ex".
      pattern: \d*.\d*(in|cm|mm|pt|px|em|ex)
    paperSize:
      type: string
      enum:
        - letter
        - legal
        - A3
        - A4
        - A5
        - B4
        - B5
        - ledger
      default: letter
      description: The paper size designation for print format rendering of reports.
    replacementStrategy:
      type: string
      description: The strategy for handling name collision when saving the result file. The value `replace` means overwrite any pre-existing file. The value `rename` specifies that the service should modify the requested name to be unique, such as by appending a number to the name. The default value is `rename`.
      enum:
        - replace
        - rename
    reportObjectLabelForImage:
      description: The name of the report object to render in the exported file. If this is left empty, the image is a rendering of the first page of the report. Report objects include visual elements like graphs, tables, visual containers that the author has created in the layout, and complete pages. Specifying the object by its label makes it more convenient for the report author or viewer and does not to expose the internal names of objects in the model. However, if the client knows the internal identifier of a report object, it can be used instead of the label.
      type: string
      example: Dual Axis Bar-Line - Merchandise Hierarchy 1
    reportObjectLabels:
      description: A list of report object names for the objects to include in the exported file. If left empty, the result is dependent on the type of the export. For some types of export, omitting report objects means that the entire report is processed. Report objects include visual elements like graphs and tables, visual containers that the author has created in the layout, and complete pages. Labels are not forced to be unique because they can be edited by the user. The design makes it more convenient for the report author or viewer and does not to expose the internal names of objects in the model. However, if the client knows the internal identifier of a report object, it can be used instead of the label.
      type: array
      items:
        type: string
    exportPdfRequest:
      type: object
      description: Information about the PDF that is requested.
      x-sas-media-type:
        name: application/vnd.sas.visual.analytics.report.export.pdf.request
        version: 1
      required:
        - version
        - options
      properties:
        resultFolder:
          $ref: "#/components/schemas/resultFolder"
        resultFilename:
          $ref: "#/components/schemas/resultFilename"
        nameConflict:
          $ref: "#/components/schemas/replacementStrategy"
        reportObjects:
          $ref: "#/components/schemas/reportObjectLabels"
        wait:
          $ref: "#/components/schemas/waitSeconds"
        timeout:
          $ref: "#/components/schemas/jobTimeout"
        options:
          $ref: "#/components/schemas/exportPdfOptions"
        version:
          type: integer
          description: Version of this request object, which is currently version 1.
    exportPackageRequest:
      type: object
      description: Information about package that is to be exported. The reportObjects property can be used to reduce the size of the resulting package. The default is to include all visual elements and pages in the report. <p> If the folder is not specified, the package is retained for a time, but is not visible in file selection windows. It is cached temporarily by the Report Packages service for a period of time sufficient for clients to check the status of the package job and download it.
      x-sas-media-type:
        name: application/vnd.sas.visual.analytics.report.export.package.request
        version: 1
      required:
        - version
      properties:
        resultFolder:
          $ref: "#/components/schemas/resultFolder"
        resultFilename:
          $ref: "#/components/schemas/resultFilename"
        nameConflict:
          $ref: "#/components/schemas/replacementStrategy"
        reportObjects:
          $ref: "#/components/schemas/reportObjectLabels"
        timeout:
          $ref: "#/components/schemas/jobTimeout"
        wait:
          $ref: "#/components/schemas/waitSeconds"
        version:
          type: integer
          description: Version of this request object, which is currently version 1.
      example:
        resultFolder: /folders/folders/01234567-0123-0123-0123-0123456789ab
        resultFileName: Status Report Package
        nameConflict: replace
        wait: 10
        timeout: 300
        reportObjects:
          - Bar Graph 1
          - Table of Frequencies
        version: 1
    exportImageRequest:
      type: object
      description: Information about the image that is to be exported. It is to be determined whether the entire body is optional, since in the first iteration of this operation, defaults can be supplied by the system for all of the fields. If an empty body is supplied in the request, a representative normal layout image of the default size is rendered of the first page of the report. The report is saved with a generated name in the personal folder of the caller's identity.
      x-sas-media-type:
        name: application/vnd.sas.visual.analytics.report.export.image.request
        version: 1
      required:
        - image
        - version
      properties:
        resultFolder:
          $ref: "#/components/schemas/resultFolder"
        resultFilename:
          $ref: "#/components/schemas/resultFilename"
        nameConflict:
          $ref: "#/components/schemas/replacementStrategy"
        reportObject:
          $ref: "#/components/schemas/reportObjectLabelForImage"
        image:
          $ref: "#/components/schemas/exportImageOptions"
        timeout:
          $ref: "#/components/schemas/jobTimeout"
        wait:
          $ref: "#/components/schemas/waitSeconds"
        version:
          type: integer
          description: Version of this request object, which is currently version 1.
    exportDataRequest:
      type: object
      description: Information about visual element data that is to be exported. The reportObject property is required to export information about the underlying data. <p> If the folder is not specified, the package is retained for a time, but is not visible in file selection windows. It is cached temporarily by the Report Data service for a period of time sufficient for clients to check the status of the package job and download it.
      x-sas-media-type:
        name: application/vnd.sas.visual.analytics.report.export.data.request
        version: 1
      required:
        - format
        - reportObject
        - version
      properties:
        format:
          type: string
          enum:
            - csv
            - tsv
            - xlsx
          default: xlsx
          description: The format of the data file that is exported. Can be comma-separated values, tab-separated values, or an excel spreadsheet. The excel option does not provided special visual formatting of the data as a table, such as fonts and colors. It outputs only rows and columns of values. Individual data values are formatted according to their definitions in the original data sets or by the report author's data format selections.
        reportObject:
          type: string
          description: Visual element name or label.
        resultFolder:
          $ref: "#/components/schemas/resultFolder"
        resultFilename:
          $ref: "#/components/schemas/resultFilename"
        nameConflict:
          $ref: "#/components/schemas/replacementStrategy"
        timeout:
          $ref: "#/components/schemas/jobTimeout"
        wait:
          $ref: "#/components/schemas/waitSeconds"
        options:
          $ref: "#/components/schemas/exportDataOptions"
        version:
          type: integer
          description: Version of this request object, which is currently version 1.
    jobTimeout:
      type: integer
      example: 60
      description: After creation of the job, the maximum number of seconds it will be allowed to run before timing out. The default maximum is a system configuration value. This option allows the maximum to be modified for this request, but its value cannot exceed a system-configured maximum limit. There is no guarantee that all background processes can be terminated when time-out is exceeded, but an attempt is made where it is possible.
    waitSeconds:
      type: integer
      example: 30
      description: Number of seconds to wait before returning from the initial POST to start the job. The default value is effectively zero, meaning to return the running job to the client as soon as it is created. Specifying a positive value instructs the server to wait on the running job for the specified number of seconds because the client expects the job to finish quickly. This allows the client to avoid having to poll for completion. It should be used cautiously because job durations are unpredictable.
    resultFilename:
      description: The user-visible file name of the output when it is saved in a folder on the server. If the resultFolder is provided and no resultFilename is specified on the request, the service gives the file a default name. On a running or completed job, the file name is either the requested name, optionally modified by the system to avoid name conflicts, or if the request specified no file name, it is the name generated by the system.
      type: string
      example: Sample Output File Name.svg
    resultFolder:
      type: string
      description: The URI of the folder in which the output file should be created. Specifying a folder URI allows the result to be visible in user interfaces that show files, and it puts the lifetime of the result file in the control of the client. If the result folder is not specified, the result file is transient; the system can clean up results on its own schedule, and it retains control of the lifetime of the file. The client can specify placeholder "/folders/folders/@myFolder" to save it in the user's personal folder. If the folder is specified and does not exist, it is an error.
    exportImageOptions:
      type: object
      description: Values needed for rendering the image.
      required:
        - format
        - size
      properties:
        format:
          type: string
          enum:
            - svg
            - png
          description: The type of image that is output, which initially can only be in a scalable vector graphic format. This property must be provided. Accepts "svg" and "png" as the allowed value.
        size:
          type: string
          example: 1234px,2313px
          description: Size of the resulting image in the form "9999px,9999px", where the horizontal dimension is before the comma and the vertical dimension is afterward. The size must be specified. The two characters after the digits are reserved for unit specifiers; for example, "1024px,768px". The only units currently supported are pixels ("px") but the unit must be specified.
    exportDataOptions:
      type: object
      description: "Options for generating and downloading a data file in one of several formats. Supported formats are CSV, TSV and XLSX. "
      properties:
        startRow:
          type: integer
          default: 0
          description: Start row to export. Default is 0.
        endRow:
          type: integer
          default: -1
          description: End Row inclusive to be exported. Default is -1 for all the rows.
        columns:
          type: array
          description: "Data items to be exported. "
        formattedData:
          type: boolean
          default: true
          description: Indicates whether the exported data should reflect any formats applied on the data item. Default is true.
        detailedData:
          type: boolean
          default: false
          description: >
            Indicates whether the exported data should be detailed data. Default is false
    exportPdfOptions:
      type: object
      description: Options for executing the action. Might describe output characteristics or control parameters. Not all properties are applicable to every action.
      properties:
        orientation:
          type: string
          enum:
            - landscape
            - portrait
          default: landscape
          description: The page orientation. Applicable to PDF rendering.
        paperSize:
          $ref: "#/components/schemas/paperSize"
        margin:
          $ref: "#/components/schemas/margin"
        includeTableOfContents:
          type: boolean
          default: false
          description: Indicates whether to generate a printed table of contents.
        showPageNumbers:
          type: boolean
          default: true
          description: Indicates whether page numbers should be displayed.
        showEmptyRowsAndColumns:
          type: boolean
          default: false
          description: Indicates whether empty rows and columns should be included to fill the allocated layout space for tables and crosstabs.
        includeAppendix:
          type: boolean
          default: true
          description: Indicates whether the appendix should be included.
        includeComments:
          type: boolean
          default: false
          description: Indicates whether the comments should be included in the appendix.
        includeDetailsTables:
          type: boolean
          default: false
          description: Indicates whether the comments should be included in the appendix.
        expandClippedContent:
          type: boolean
          default: false
          description: Enables you to see all of the content for tables, crosstabs, gauges, and containers. This includes content that is only partially available in the layout of the page. Each object is displayed on a separate page at the end of the report.
        includeCoverPage:
          type: boolean
          default: true
          description: Indicates whether a cover page should be included.
        coverPageText:
          type: string
          default: ""
          description: Optional text to be included on the cover page. This setting is ignored if includeCoverPage is false.
    exportPdfJob:
      type: object
      description: An object representing a job that is run asynchronously for this service.
      x-sas-media-type:
        name: application/vnd.sas.visual.analytics.report.export.pdf.job
        version: 1
      required:
        - id
        - state
      properties:
        id:
          type: string
          description: The identifier of the action job, usually a UUID, generated by the service.
        state:
          $ref: "#/components/schemas/jobState"
        inputReport:
          $ref: "#/components/schemas/jobInputReport"
        reportObjects:
          $ref: "#/components/schemas/reportObjectLabels"
        resultFolder:
          $ref: "#/components/schemas/resultFolder"
        resultFilename:
          $ref: "#/components/schemas/resultFilename"
        nameConflict:
          $ref: "#/components/schemas/replacementStrategy"
        resultMediaType:
          $ref: "#/components/schemas/resultMediaType"
        creationTimestamp:
          $ref: "#/components/schemas/creationTimestamp"
        endTimestamp:
          $ref: "#/components/schemas/endTimestamp"
        links:
          $ref: "#/components/schemas/exportJobLinks"
        version:
          type: integer
          description: Version of this export job, which is currently version 1.
      example:
        id: 12345678-abcd-ef12-3456-12345678abab
        state: running
        inputReport: /reports/reports/12345678-abcd-ef12-3456-12345678abcd
        reportObjects:
          - Bar Graph 1
          - Table of Frequencies
        resultFolder: /folders/folders/01234567-0123-0123-0123-0123456789ab
        resultFileName: Status Report Final
        nameConflict: replace
        resultMediaType: application/pdf
        creationTimeStamp: 2021-06-21T21:10:31.123Z
        endTimeStamp: 2021-06-21T21:10:41.123Z
        links:
          - rel: self
            method: GET
            type: application/vnd.sas.visual.analytics.report.export.pdf.job
            uri: /visualAnalytics/jobs/12345678-1234-1234-1234-123456789abc
            href: /visualAnalytics/jobs/12345678-1234-1234-1234-123456789abc
          - rel: result
            method: GET
            type: application/*
            uri: /files/files/12345678-1234-1234-1234-123456789abc/content
            href: /files/files/12345678-1234-1234-1234-123456789abc/content
          - rel: delete
            method: DELETE
            uri: /visualAnalytics/jobs/12345678-1234-1234-1234-123456789abc
            href: /visualAnalytics/jobs/12345678-1234-1234-1234-123456789abc
          - rel: deleteContent
            method: DELETE
            uri: /files/files/12345678-1234-1234-1234-123456789abc
            href: /files/files/12345678-1234-1234-1234-123456789abc
        version: 1
    exportPackageJob:
      type: object
      description: An object representing a job that is run asynchronously for this service.
      x-sas-media-type:
        name: application/vnd.sas.visual.analytics.report.export.package.job
        version: 1
      properties:
        id:
          type: string
          description: The identifier of the action job, usually a UUID, generated by the service.
        state:
          $ref: "#/components/schemas/jobState"
        inputReport:
          $ref: "#/components/schemas/jobInputReport"
        reportObjects:
          $ref: "#/components/schemas/reportObjectLabels"
        resultFolder:
          $ref: "#/components/schemas/resultFolder"
        resultFileName:
          $ref: "#/components/schemas/resultFilename"
        nameConflict:
          $ref: "#/components/schemas/replacementStrategy"
        resultMediaType:
          $ref: "#/components/schemas/resultMediaType"
