    dataItemProperties:
      description: The properties to be updated on the data item.
      type: object
      properties:
        name:
          description: The new name of the data item.
          type: string
        format:
          description: The new format of the data item.
          type: string
        aggregation:
          description: The new aggregation of the data item.
          type: string
          enum:
            - sum
            - average
            - min
            - max
            - count
            - median
            - variance
            - numberMissing
            - standardDeviation
            - standardError
            - firstQuartile
            - thirdQuartile
            - skewness
            - kurtosis
            - coefficientOfVariation
            - correctedSumOfSquares
            - uncorrectedSumOfSquares
            - tStatistic
            - pValue
        classification:
          description: The new classification of the data item.
          type: string
          enum:
            - category
            - measure
            - geography
        geographyDataSource:
          description: The geography data source that is applicable for a classification of "geography". This property is optional and is allowed only if the classification is being set to a geography. If this object is provided, either the geographyNameCodeContext property or the geographyCoordinates property is required, but both are not allowed. If not provided, the default property geographyNameCodeContext is used with a value of "CountryRegionNames".
          type: object
          properties:
            geographyNameCodeContext:
              description: The geography name or code context for the data item. If this value is SubdivisionNames, the property geographyCountryRegion must be specified as well.
              type: string
              enum:
                - CountryRegionNames
                - CountryRegionISO2LetterCodes
                - CountryRegionISO3LetterCodes
                - CountryRegionISONumericCodes
                - CountryRegionSASMapIdValues
                - SubdivisionNames
                - SubdivisionSASMapIdValues
                - USStateNames
                - USStateAbbreviations
                - USZipCodes
            geographyCountryRegion:
