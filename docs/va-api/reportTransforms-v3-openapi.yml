          required: true
          description: The language of the translation.
          schema:
            type: string
        - name: saveResult
          in: query
          description: Determines whether the transformed report is saved to the repository. If false, the transformed report is returned to the client as part of the body. If true, the BIRD report is saved in the repository and not returned in the body of the response. The `vnd.sas.report.transform` in the response body contains links to retrieve the resulting resource.
          required: false
          schema:
            type: boolean
        - name: validate
          in: query
          required: false
          description: Determine whether the report content is to be schema validated. Defaults to true. When validation is performed, errors do not necessarily halt processing; the evaluation will still be done.
          schema:
            type: boolean
            default: true
      requestBody:
        content:
          application/vnd.sas.report.transform+json:
