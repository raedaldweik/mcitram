  "/rethemedReports/{reportId}/{themeName}":
    get:
      summary: Change theme of existing report
      description: Returns a rethemed version of a saved report.
      operationId: getRethemedReport
      tags:
        - Themes
      externalDocs:
        description: BIRD Localization Specification
        url: http://localhost/apis/Business_Intelligence_Report_Definition_Localization
      parameters:
        - name: reportId
          description: The report from which the report should be read, rethemed, and returned.
          in: path
          required: true
          schema:
            type: string
        - name: themeName
          in: path
          required: true
          description: The id of the new theme.
          schema:
            type: string
        - name: validate
          in: query
          required: false
          description: Determine whether to validate the report content against the XML schema, and whether the themeName is a published report theme. Defaults to true. Schema validation errors do not necessarily halt processing. Errors are reported in the transform's errorMessages list.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Successful retheming of the report and returned.
          headers:
            Content-Type:
              description: As specified above for type produced.
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
            ETag:
              description: Identifier of the existing report.
              schema:
                type: string
          content:
            application/vnd.sas.report.transform+json:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Rethemed report response:
                  $ref: "#/components/examples/rethemedReportResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Rethemed report response:
                  $ref: "#/components/examples/rethemedReportResponse"
        "400":
          $ref: "#/components/responses/badTransformRequest"
  "/rethemedReports/{themeName}":
    post:
      summary: Change theme of submitted report
      operationId: createRethemedReport
      description: Change the theme of the report in the body of the request using the specified themeName. Return a transform containing the rethemed report. Optionally, get the input report from a persistent report resource, specified in the input transform. Also optionally, save the modified report as a persistent resource.  If the input report is a persistent report, optionally replace it with the modified version.  This operation has been enhanced in Version 2 to facilitate a single-step CLI operation to change the themes of existing reports.
      tags:
        - Themes
      externalDocs:
        description: BIRD Localization Specification
        url: http://localhost/apis/Business_Intelligence_Report_Definition_Localization
      parameters:
        - name: themeName
          in: path
          required: true
          description: The name of the new theme.
          schema:
            type: string
        - name: saveResult
          in: query
          description: Determines whether the transformed report is saved to the repository. If true, the report is saved.  The response transform contains links to retrieve the resulting report.  Assumes that `resultReportName` and `resultParentFolderUri` in the request transform can be used for the location of the resulting report.
          required: false
          schema:
            type: boolean
            default: false
        - name: useSavedReport
          description: Specifies whether to find the input report as a permanent resource. If true, the input transform must provide the reference to the input report. If false, the input report is in the transform in the request body. (Added in Version 2)
          required: false
          in: query
          schema:
            type: boolean
            default: false
        - name: replaceSavedReport
          in: query
          description: Specifies that the input report resource specified by the `inputReportUri` property of the request transform should be modified in place with the new theme. (Added in Version 2)
          required: false
          schema:
            type: boolean
            default: false
        - name: returnContent
          in: query
          description: Determines whether the transformed report is embedded in the response transform. If false, the report is not returned. If true, the report is returned. (Added in Version 2)
          required: false
          schema:
            type: boolean
            default: true
        - name: validate
          in: query
          required: false
          description: Determine whether to validate the report content against the schema. Validation errors do not necessarily halt processing.
          schema:
            type: boolean
            default: true
      requestBody:
        content:
          application/vnd.sas.report.transform+json:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              Rethemed report request:
                $ref: "#/components/examples/rethemedReportRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              Rethemed report request:
                $ref: "#/components/examples/rethemedReportRequest"
        description: The input transform and the report to retheme.
        required: true
      responses:
        "201":
          description: Rethemed version of the report generated and returned.
          headers:
            Content-Type:
              description: As specified above for types produced.
              schema:
                type: string
            Location:
              description: Location of created report resource, if saved. Also contained in the links of the response transform.
              schema:
                type: string
          content:
            application/vnd.sas.report.transform+json:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Rethemed report response:
                  $ref: "#/components/examples/rethemedReportResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Rethemed report response:
                  $ref: "#/components/examples/rethemedReportResponse"
        "400":
          $ref: "#/components/responses/badTransformRequest"
        "406":
          description: The media type is incorrect.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError406"
  "/commons/validations/translationWorksheets/{reportId}/{translationLocale}":
    put:
      summary: Validate conditional put operations
      operationId: updateTranslationWorksheetValidation
      description: Pre-flight validation of the PUT operation, which would update the internal localization strings of an existing report. Always returns HTTP response 200 unless a server error prevents the actual validation logic from being executed.
      tags:
        - Translation
      parameters:
        - name: reportId
          description: The id of the report that would have its localization be updated by the PUT operation.
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          description: ETag identifier from last GET of the report.
          schema:
            type: string
        - name: translationLocale
          in: path
          description: The locale specifier for which strings should be extracted. If the locale is not defined in the report, an HTTP 400 error is returned.
          required: true
          schema:
            type: string
      requestBody:
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/translationWorksheet"
            examples:
              translation worksheet request:
                $ref: "#/components/examples/translationWorksheetRequest"
        description: The body of the request is a string translation worksheet.
        required: true
      responses:
        "200":
          description: Except for unusual server problems, this will always be returned. However, the validation will contain information about errors that would happen if the PUT were actually called, as shown by the additional errors.
          headers:
            Content-Type:
              description: application/vnd.sas.validation+json
              schema:
                type: string
            ETag:
              description: Current content ETag for the report to be modified. Use for subsequent PUT operation.
              schema:
                type: string
          content:
            application/vnd.sas.validation+json:
              schema:
                $ref: "#/components/schemas/validation"
              examples:
                translation worksheet response:
                  $ref: "#/components/examples/translationWorksheetResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/validation"
              examples:
                translation worksheet response:
                  $ref: "#/components/examples/translationWorksheetResponse"
        "400":
          $ref: "#/components/responses/badRequestValidation"
        "412":
          description: The header If-Match Etag value does not match.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError412"
        "428":
          description: The If-Match head ETag did not match current report.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
