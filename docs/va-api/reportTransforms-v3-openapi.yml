      description: Translate the report in the body of the request using its internal localization for the requested language. Substitute the translated strings from the internal localization for the original strings in the body of the report. Return a transform containing the translated report.
      tags:
        - Translation
      externalDocs:
        description: BIRD Localization Specification
        url: http://localhost/apis/Business_Intelligence_Report_Definition_Localization
      parameters:
        - name: translationLocale
