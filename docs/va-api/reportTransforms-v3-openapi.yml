          application/xml:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              translated report request:
                $ref: "#/components/examples/translatedReportRequest"
        description: The body of the request contains the input transform and the report on which the translation is done.
        required: true
      responses:
        "201":
          description: Successfully translated version of the report generated and returned.
          headers:
            Content-Type:
              description: As specified above for types produced.
