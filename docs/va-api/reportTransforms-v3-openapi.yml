      tags:
        - Datasources
      parameters:
        - name: reportId
          description: The resource Id of the report that should be processed.
          in: path
          required: true
          schema:
            type: string
        - name: failOnDataSourceError
          in: query
          required: false
          description: When the replacement data source is tested for compatibility and serious errors occur, the service can either fail and return, or it can attempt to continue. This parameter can be used to force a change even if there are errors.
          schema:
            type: boolean
            default: true
      requestBody:
        content:
          application/vnd.sas.report.transform+json:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              Data mapped request:
                $ref: "#/components/examples/dataMappedReportRequest"
          application/vnd.sas.report.transform+xml:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              Data mapped request:
                $ref: "#/components/examples/dataMappedReportRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              Data mapped request:
                $ref: "#/components/examples/dataMappedReportRequest"
          application/xml:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              Data mapped request:
                $ref: "#/components/examples/dataMappedReportRequest"
        description: The body of the request contains the input transform and the report content (or reference to the report) on which data mapping is performed.
        required: true
      responses:
        "201":
          description: Successful transformation. The resulting transform was "created" and returned.
          headers:
            Content-Type:
              description: The application/vnd.sas.report.transform response contains the BIRD report in its `reportContent` property. If saveResult is true, the savedReportResource property of the transform contains the URI for the application/vnd.sas.report resource that was saved.
              schema:
                type: string
            ETag:
              description: Identifier for preconditions of the saved report, when saveReport was specified.
              schema:
                type: string
            Last-Modified:
              description: Date and time when the resulting report was saved.
              schema:
                type: string
            Location:
              description: Location of created report resource, if saved. Also contained in the links of the response transform.
              schema:
                type: string
          content:
            application/vnd.sas.report.transform+json:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Data mapped response:
                  $ref: "#/components/examples/dataMappedReportResponse"
            application/vnd.sas.report.transform+xml:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Data mapped response:
                  $ref: "#/components/examples/dataMappedReportResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Data mapped response:
                  $ref: "#/components/examples/dataMappedReportResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Data mapped response:
                  $ref: "#/components/examples/dataMappedReportResponse"
        "400":
          $ref: "#/components/responses/badTransformRequestJsonXml"
        "409":
          $ref: "#/components/responses/transformConflictError"
        "415":
          description: The media types and formats for the request and response should match (JSON or XML).
          headers:
            Content-Type:
              schema:
                type: string
            Location:
              description: Not generally set on this error.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError415"
            application/vnd.sas.error+xml:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError415"
    put:
      summary: Change report data source of a saved report and save the result
      operationId: updateDataMappedReportOfSavedReportAndSave
      description: Load a saved report. Swap one data source for another, and map data columns to corresponding replacement columns. The transform object must specify the original data source and the replacement data source. The replacement data source must exist, as its variables are matched against the original to determine if the replacement will be valid. The input and output formats must match. If a JSON request is posted, a JSON response must be accepted, and likewise for XML.  The result is then saved.
      tags:
        - Datasources
      parameters:
        - name: reportId
          description: The resource Id of the report that should be processed.
          in: path
          required: true
          schema:
            type: string
        - name: failOnDataSourceError
          in: query
          required: false
          description: When the replacement data source is tested for compatibility and serious errors occur, the service can either fail and return, or it can attempt to continue. This parameter can be used to force a change even if there are errors.
          schema:
            type: boolean
            default: true
        - name: If-Match
          in: header
          description: The etag identifier from the last GET of the report.
          schema:
            type: string
      requestBody:
        content:
          application/vnd.sas.report.transform+json:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              Data mapped request:
                $ref: "#/components/examples/dataMappedReportRequest"
          application/vnd.sas.report.transform+xml:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              Data mapped request:
                $ref: "#/components/examples/dataMappedReportRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              Data mapped request:
                $ref: "#/components/examples/dataMappedReportRequest"
          application/xml:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              Data mapped request:
                $ref: "#/components/examples/dataMappedReportRequest"
        description: The body of the request contains the input transform and the report content (or reference to the report) on which data mapping is performed.
        required: true
      responses:
        "200":
          description: Successful transformation. The resulting transform was "created" and returned.
          headers:
            Content-Type:
              description: The application/vnd.sas.report.transform response contains the BIRD report in its `reportContent` property. If saveResult is true, the savedReportResource property of the transform contains the URI for the application/vnd.sas.report resource that was saved.
              schema:
                type: string
            ETag:
              description: Identifier for preconditions of the saved report, when saveReport was specified.
              schema:
                type: string
            Last-Modified:
              description: Date and time when the resulting report was saved.
              schema:
                type: string
            Location:
              description: Location of created report resource, if saved. Also contained in the links of the response transform.
              schema:
                type: string
          content:
            application/vnd.sas.report.transform+json:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Data mapped response:
                  $ref: "#/components/examples/dataMappedReportResponse"
            application/vnd.sas.report.transform+xml:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Data mapped response:
                  $ref: "#/components/examples/dataMappedReportResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Data mapped response:
                  $ref: "#/components/examples/dataMappedReportResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Data mapped response:
                  $ref: "#/components/examples/dataMappedReportResponse"
        "400":
          $ref: "#/components/responses/badTransformRequestJsonXml"
        "409":
          $ref: "#/components/responses/transformConflictError"
        "412":
          description: The header If-Match Etag value did not match.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError412"
        "415":
          description: The media types and formats for the request and response should match (JSON or XML).
          headers:
            Content-Type:
              schema:
                type: string
            Location:
              description: Not generally set on this error.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError415"
            application/vnd.sas.error+xml:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError415"
        "428":
          description: The precondition header If-Match was not provided.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
  "/translationWorksheets/{reportId}/{translationLocale}":
    get:
      summary: Get translation worksheet for report
      operationId: getTranslationWorksheet
      description: Extract the translatable strings from an existing report and return a worksheet that can be used by a human translator to specify the strings in a different language.
      tags:
        - Translation
      parameters:
        - name: reportId
          description: The resource Id of the report that should be processed.
          in: path
          required: true
          schema:
            type: string
        - name: translationLocale
          in: path
          description: The locale specifier for which strings should be extracted. If the locale is not defined in the report, an HTTP 400 error is returned.
          required: true
          schema:
            type: string
        - name: validate
          in: query
          required: false
          description: Determine whether to validate the report content against the XML schema. Defaults to true. Schema validation errors do not necessarily halt processing. Errors are reported in the transform's errorMessages list. Worksheet creation will be completed even after an error.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Successfully retrieved the worksheet from the report.
          headers:
            Content-Type:
              description: As specified above.
              schema:
                type: string
            ETag:
              description: Identifier of existing report for precondition of PUT.
              schema:
                type: string
            Last-Modified:
              description: Not typically set.  Use the ETag.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
              examples:
                translation worksheet response:
                  $ref: "#/components/examples/translationWorksheetResponse"
            application/vnd.sas.report.translation.worksheet+json:
              schema:
                $ref: "#/components/schemas/translationWorksheet"
              examples:
                translation worksheet response:
                  $ref: "#/components/examples/translationWorksheetResponseAsJSON"
            application/json:
              schema:
                $ref: "#/components/schemas/translationWorksheet"
              examples:
                translation worksheet response:
                  $ref: "#/components/examples/translationWorksheetResponseAsJSON"
        "400":
          description: The request was invalid.
          headers:
            Content-Type:
              schema:
                type: string
            ETag:
              description: Identifier of existing report for precondition of PUT.  Not typically set on error condition
              schema:
                type: string
            Last-Modified:
              description: Not typically set.  Use the ETag.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
    put:
      summary: Update localization in a report
      operationId: updateTranslationWorksheet
      description: Insert the translator's language worksheet into an existing report and save the report. This saves the human translator's strings for the specified locale so that the report can be generated later in the locale's language.  This action returns no content.
      tags:
        - Translation
      parameters:
        - name: reportId
          description: The report from which the original report should be read.
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          description: The etag identifier from the last GET of the report.
          schema:
            type: string
        - name: translationLocale
          in: path
          required: true
          description: The locale for which the translation should be extracted.
          schema:
            type: string
      requestBody:
        content:
          text/plain:
            schema:
              type: string
            examples:
              translation worksheet response:
                $ref: "#/components/examples/translationWorksheetResponse"
          application/vnd.sas.report.translation.worksheet+json:
            schema:
              $ref: "#/components/schemas/translationWorksheet"
            examples:
              translation worksheet response:
                $ref: "#/components/examples/translationWorksheetResponseAsJSON"
          application/json:
            schema:
              $ref: "#/components/schemas/translationWorksheet"
            examples:
              translation worksheet response:
                $ref: "#/components/examples/translationWorksheetResponseAsJSON"
        description: The body of the request is the translation worksheet.
        required: true
      responses:
        "200":
          description: See code 204.  This is a departure from a typical PUT, which would return the modified object, but in this case, returning the modified report is undesirable.
          headers:
            ETag:
              description: See code 204.
              schema:
                type: string
        "204":
          description: Worksheet was inserted into the report. No content returned.
          headers:
            ETag:
              description: Identifier of modified report for precondition of subsequent PUT.
              schema:
                type: string
            Location:
              description: Location of modified report resource.  Should be duplicate information that matches the input parameter.
              schema:
                type: string
        "400":
          description: The request was invalid.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
        "412":
          description: The header If-Match Etag value did not match.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError412"
        "428":
          description: The precondition header If-Match was not provided.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError428"
  "/translationWorksheets/{translationLocale}#content":
    post:
      summary: Get localization worksheet
      operationId: createTranslationWorksheetFromContent
      description: Extract the translator's localization worksheet from a report for the specified locale. The human translator can use the worksheet to translate individual strings, and the worksheet can later be saved back to the report.
      tags:
        - Translation
      parameters:
        - name: translationLocale
          in: path
          required: true
          description: The locale for which the translation should be extracted.
          schema:
            type: string
        - name: validate
          in: query
          required: false
          description: Determine whether to validate the report content against an XML schema. Defaults to true. Schema validation errors do not necessarily halt processing. Errors are reported in the transform's errorMessages list. The localization action will still be attempted, even if there are errors.
          schema:
            type: boolean
            default: true
      requestBody:
        content:
          application/vnd.sas.report.content+json:
            schema:
              $ref: "#/components/schemas/sasReport"
            examples:
              translation worksheet request:
                $ref: "#/components/examples/translationWorksheetRequest"
          application/vnd.sas.report.content+xml:
            schema:
              $ref: "#/components/schemas/sasReport"
            examples:
              translation worksheet request:
                $ref: "#/components/examples/translationWorksheetRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/sasReport"
            examples:
              translation worksheet request:
                $ref: "#/components/examples/translationWorksheetRequest"
          application/xml:
            schema:
              $ref: "#/components/schemas/sasReport"
            examples:
              translation worksheet request:
                $ref: "#/components/examples/translationWorksheetRequest"
        description: The BIRD report from which to extract the translatable strings.
        required: true
      responses:
        "201":
          description: Successful creation of language worksheet from the input report.
          headers:
            Content-Type:
              description: As specified above for types produced.
              schema:
                type: string
            Location:
              description: Typically, the location of the persistent report resource, if there is one involved. Not applicable in this situation because results are returned directly to the user.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
              examples:
                translation worksheet response:
                  $ref: "#/components/examples/translationWorksheetResponse"
        "400":
          description: The request was invalid. Some error in the request resulted in failure to perform the action. See the error codes table for further details.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
  "/translatedReports/{reportId}/{translationLocale}":
    get:
      summary: Translate a saved report
      operationId: getTranslatedReport
      description: Translate an existing report into the desired language. Substitutes previously translated strings for the specified language into the body of the report. Uses strings that are in the report's internal localizations.
      tags:
        - Translation
      externalDocs:
        description: BIRD Localization Specification
        url: http://localhost/apis/Business_Intelligence_Report_Definition_Localization
      parameters:
        - name: reportId
          description: The report from which the report should be read, translated, and returned.
          in: path
          required: true
          schema:
            type: string
        - name: translationLocale
          in: path
          required: true
          description: The language in which the report should be returned.
          schema:
            type: string
        - name: validate
          in: query
          required: false
          description: Determine whether to validate the report content against an XML schema. Defaults to true. Schema validation errors do not necessarily halt processing. Errors are reported in the transform's errorMessages list.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Successful translation produced from report and returned.
          headers:
            Content-Type:
              description: As specified above for type produced.
              schema:
                type: string
            ETag:
              description: Identifier of the existing report.
