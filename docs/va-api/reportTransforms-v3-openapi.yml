          minimum: 1
        links:
          description: The API's top-level links.
          type: array
          items:
            $ref: "#/components/schemas/link"
    validation:
      title: Validation Response
      description: The response from a pre-flight validation request. For APIs which support validation, the client can run operations (typically on resources in the `/commons/validation`) with `application/vnd.sas.validation+json` as the requested response type (via the `Accept:` request header). The service will validate the request but not execute the request, and return this response to indicate if the request was valid at the time it was made.
      x-sas-media-type:
        name: application/vnd.sas.validation
        version: 1
      required:
        - version
        - valid
      properties:
        version:
          description: This media type's schema version number. This representation is version 1.
          type: integer
        valid:
          description: "`true` if and only if the validation was successful."
          type: boolean
        error:
          $ref: "#/components/schemas/error2"
        links:
          type: array
          description: An array of links to related resources and actions.
          items:
            $ref: "#/components/schemas/link"
