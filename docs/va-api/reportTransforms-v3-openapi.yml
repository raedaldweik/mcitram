  schemas:
    transform:
      description: The tranform is the primary payload in this service, for both requests and responses. Depending on the operation, some fields are required. For example, if the report to transform is a saved report, the `inputReportUri` field is required. Otherwise, the input report is in the body of request (in the transform) and `reportContent` is required.
      properties:
        id:
          type: string
          format: identifier
          description: Identifier for this instance. Usually a GUID, but does not need to be globally unique.
        version:
          type: number
          description: This media type's schema version number. This representation is version 1.
        creationTimeStamp:
          type: string
          format: date-time
          description: The date and time the transform was generated.
        createdBy:
          type: string
          description: User name or identity of service that created the transform object.
        modifiedTimeStamp:
          type: string
          format: date-time
          description: The date and time the transform was modified.
        modifiedBy:
          type: string
          description: User name or identity of service that modified the transform object last. Optional.
        inputReportUri:
          type: string
          description: The persisted report from which the transform should create the result.
          format: uri
        resultReportName:
          type: string
          description: On input, this specifies the human-readable name for the resulting report when the result is saved. It is not used on a response transform.
          format: uri
        resultParentFolderUri:
          type: string
          description: An identifier (URI) for the parent folder in which to save the result report. If omitted, the default is the user's personal folder.
          format: uri
        resultReport:
          $ref: "#/components/schemas/report"
        dataSources:
          type: array
          items:
            $ref: "#/components/schemas/dataSource"
          description: An array of data source objects, some of which are matched to CAS tables, some to the data sources in the report.
        schemaValidationStatus:
          type: string
          enum:
            - schemaValid
            - schemaInvalid
          description: A value indicating the status returned by schema validation.
        evaluationStatus:
          type: string
          description: Success or failure designation.
          enum:
            - evaluationValid
            - evaluationInvalid
        evaluation:
          type: array
          items:
            type: string
          description: Text generated during semantic evaluation of the source.
        messages:
          type: array
          description: Localized messages generated in the process of creating the transformed report.
          items:
            $ref: "#/components/schemas/codedMessage"
        errorMessages:
          type: array
          description: Error messages generated in the process of creating the transformed report with associated codes.
          items:
            $ref: "#/components/schemas/codedMessage"
        substitutionParameters:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: The identifier of the element for which the value should be changed.
              label:
                type: string
                description: Optional visual label for prompting user for the value.
              site:
                type: string
                description: The kind of location in the report where the parameter value would be defined.
                enum:
                  - parameterDefinition
                  - parameterState
                  - urlParameter
              structure:
                type: string
                description: Whether values are expected to be single, list or a range.
                enum:
                  - single
                  - multiple
                  - range
              type:
                type: string
                description: Data type of the expected values.
                default: string
                enum:
                  - string
                  - number
                  - date
                  - datetime
                  - time
                  - missing
              values:
                type: array
                items:
                  type: string
        reportContent:
          $ref: "#/components/schemas/sasReport"
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
          description: Link objects, as described in SAS standards documentation.
    sasReport:
      type: object
      description: A report content that is the equivalent of the application/vnd.sas.report.content media type.  The report content is defined by a non-public XML Schema. The structure shown here is an abbreviation showing only a few of the descriptive attributes of the object.
      required:
        - xmlns
      properties:
        xmlns:
          type: string
          description: The XML Schema to which the object conforms.
        label:
          type: string
          description: User's name for the report.
        modifiedBy:
          type: string
          description: Last modifying user id.
        dateCreated:
          type: string
          format: date-time
          description: Date of report creation.
        dateModified:
          type: string
          format: date-time
          description: Date of last modification.
        lastModifiedApplicationName:
          type: string
          description: User-readable name of application name that last modified.
        createdBy:
          type: string
          description: Creating user id.
        createdApplicationName:
          type: string
          description: User-readable name of application, if any.
        createdLocale:
          type: string
          description: Locale of the report when first created and serialized.
        createdVersion:
          type: string
          description: Schema version of report when created.
    dataSource:
      description: A data source that is used in a data mapping operation in a report.
      required:
        - purpose
      properties:
        purpose:
          type: string
          description: When the data source is part of a data mapping operation, specifies whether it is the "original" or "replacement". When the data source is being created as part of an automatic report operation, the value is "creation". When the data is changed by a filter, ranking, or similar operation, the value is "modification".
          enum:
            - original
            - replacement
            - creation
            - modification
        namePattern:
          type: string
          description: Enumeration of the way the data source is identified. Using "uniqueName" is valid only when the data source is an original within the report that is being changed during a data mapping operation.   If no value is specified, most operations will assume it is "serverLibraryTable" and may fail if the corresponding server, library, and table values are not set. (There are some special cases where other assumptions could be made, depending on the operation.  For example, an operation could select the first BIRD `DataSource` it finds in an input report, and not rely on this attribute.)
          enum:
            - uniqueName
            - serverLibraryTable
        server:
          type: string
          description: CAS server name.
        library:
          type: string
          description: CAS library name.
        table:
          type: string
          description: CAS table name.
        uniqueName:
          type: string
          description: Reference to a data source in the report using its internal name.
        replacementLabel:
          type: string
          description: New label for the data source, or an override to what is in the CAS table.
        dataItemReplacements:
          type: array
          description: Replacement names for individual data items when doing a data mapping operation. In order for a data item to be replaced, exactly one of the `originalName` or `originalColumn` is required. If both `originalName` or `originalColumn` are specified, it is not an error, but the behavior is at the discretion of the operation.
          items:
            description: For the specifying data item to be replaced, exactly one of the `originalName` or `originalColumn` is required. If both `originalName` or `originalColumn` are specified, it is not an error, but the behavior is at the discretion of the operation.
            type: object
            required:
              - replacementColumn
            properties:
              originalName:
                type: string
                description: The previous (or current) data item unique name in the report.
              originalColumn:
                type: string
                description: The previous (or current) data item xref or column name in the CAS table.
              replacementColumn:
                type: string
                description: The column name of the replacement column on the CAS table. This property is required.
      example:
        purpose: original
        namePattern: serverLibraryTable
        server: cas1
        library: public
        table: mailorders
        replacementLabel: Mail Orders for Current Year
        dataItemReplacements:
          - originalName: bi124
            replacementColumn: customer
          - originalColumn: ADDR
            replacementColumn: Address
    codedMessage:
      type: object
      description: A message for the user with an associated error or warning code.
      properties:
        code:
          type: integer
          description: A specific code that is documented externally.
        text:
          type: string
          description: The text of the message.
        item:
          type: string
          description: The name of a uniquely named element in the report that is the object of the message. It is usually a data item.
      example:
        code: 27599
        text: There was a problem in transforming this element.
        item: bi1349
    translationWorksheet:
      type: object
      description: Prior to version 2, this was not an object. Instead, it was serialized as lines of user-editable plain text. When serialized as text, the first line is the locale indicator, and the subsequent lines have the form `proprietary path identifiers = translatable text`.
      properties:
        locale:
          type: string
          description: A valid IETF language tag.
        lines:
          description: Individual lines with translatable strings. Each line has a substructure of `identifier=value`, where the value part is what should be translated.
          type: array
          items:
            type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/link"
          description: Link objects, as described in SAS standards documentation.
        version:
          type: integer
          description: Standard field. This media type's schema version number. This representation is version 1.
    error2:
      title: Error
      type: object
      description: The representation of an error.
      x-sas-media-type:
        name: application/vnd.sas.error
        version: 2
      required:
        - httpStatusCode
        - version
      properties:
        message:
          type: string
          description: The message for the error.
        id:
          type: string
          description: The string ID for the error.
        errorCode:
          type: integer
          description: The numeric ID for the error.
        httpStatusCode:
          type: integer
          description: The HTTP status code for the error.
        details:
          type: array
          description: Messages that provide additional details about the cause of the error.
          items:
            type: string
        remediation:
          type: string
          description: A message that describes how to resolve the error.
        errors:
          type: array
          description: Any additional errors that occurred.
          items:
            $ref: "#/components/schemas/error2"
        links:
          type: array
          description: The links that apply to the error.
          items:
            $ref: "#/components/schemas/link"
        version:
          type: integer
          description: The version number of the error representation. This representation is version 2.
    link:
      title: Link
      type: object
      description: A link to a related operation or resource.
      required:
        - rel
      properties:
        method:
          type: string
          description: The HTTP method for the link.
        rel:
          type: string
          description: The relationship of the link to the resource.
        uri:
          type: string
          description: The relative URI for the link.
        href:
          type: string
          description: The URL for the link.
        title:
          type: string
          description: The title for the link.
        type:
          type: string
          description: The media type or link type for the link.
        itemType:
          type: string
          description: If this is a link to a container, `itemType` is the media type or link type for the items in the container.
        responseType:
          type: string
          description: The media type or link type of the response body for a `PUT`, `POST`, or `PATCH` operation.
        responseItemType:
          type: string
          description: The media type or link type of the items in the response body for a `PUT`, `POST`, or `PATCH` operation.
    report:
      description: The representation of a report. This representation is version 1.
      x-sas-media-type:
        name: application/vnd.sas.report
        version: 1
      type: object
      required:
        - name
      properties:
        id:
          type: string
          description: Unique identifier of the report.
          example: f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
        name:
          type: string
          description: Name of the report.
          example: Sample Report
        description:
          type: string
          description: Description of the report.
          example: Description of a sample report.
        creationTimeStamp:
          type: string
          format: date-time
          description: Date and time when the report was created.
        createdBy:
          type: string
          description: The user who created the report.
          example: user1
        modifiedTimeStamp:
          type: string
          format: date-time
          description: Date and time when the report was modified.
        modifiedBy:
          type: string
          description: The user who modified the report.
          example: user1
        links:
          type: array
          description: A set of links to related resources or operations.
          items:
            $ref: "#/components/schemas/link"
          example:
            - method: GET
              rel: self
              href: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
              uri: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
              type: application/vnd.sas.report
            - method: GET
              rel: alternate
              href: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
              uri: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
              type: application/vnd.sas.summary
            - method: PUT
              rel: update
              href: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
              uri: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
              type: application/vnd.sas.report
              responseType: application/vnd.sas.report
            - method: PUT
              rel: updateContent
              href: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf/content
              uri: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf/content
              type: application/vnd.sas.report.content
              responseType: application/vnd.sas.report.content
        imageUris:
          type: object
          properties:
            icon:
              type: string
          required:
            - icon
          additionalProperties:
            type: string
          example:
            icon: /reports/icons/report.gif
        version:
          type: integer
          description: media type's schema version number
          example: 1
    api:
      title: API
      description: The list of links to top-level resources and operations available from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      required:
        - version
        - links
      properties:
