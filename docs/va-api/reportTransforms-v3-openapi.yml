openapi: 3.0.3
info:
  version: "3"
  title: Report Transforms
  description: This API creates and manipulates "transforms" of SAS reports that conform to the Business Intelligence Report Definition (BIRD)  specification. A transform is a wrapper for a BIRD report. When a transform is part of a request, it contains instructions and parameters to perform an editing action or structural modification to the report. When a transform is part of a response, it describes the action or modification that was performed or attempted. The response transform  contains either the BIRD report directly, or it has a reference to a persistent report. All GET operations have a corresponding HEAD that is identical in all respects, except that a response body is not returned.
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
  - url: http://example.com/reportTransforms
    description: This is an example of a base URL.
tags:
  - name: Service
    description: Getting status of the service and a description the API.
  - name: Datasources
    description: Mapping the data sources used by a BIRD report to different data sources.
  - name: Translation
    description: Assisting language translators and report authors to translate BIRD reports into a different human language.
  - name: Themes
    description: Automating applying a new theme to BIRD reports.
paths:
  /:
    get:
      summary: Get list of top-level links
      operationId: root
      description: Returns a list of top-level links to the resources available in the service.
      tags:
        - Service
      responses:
        "200":
          description: Return top-level links in type application/vnd.sas.api.
          headers:
            Content-Type:
              description: Format will match the request Accept header.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/ApiLinks.v1"
            application/json:
              schema:
                $ref: "#/components/schemas/api"
              examples:
                api:
                  $ref: "#/components/examples/ApiLinks.v1"
        "400":
          description: The request was invalid. An error in the request resulted in failure to perform the action. See the error codes table for further details.
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError400"
  /dataMappedReports:
    post:
      summary: Change report data source
      operationId: createDataMappedReport
      description: Create a new report based on the input report. Swap one data source for another, and map data columns to corresponding replacement columns. The transform object must specify the original data source and the replacement data source. The replacement data source must exist, as its variables are matched against the original to determine if the replacement will be valid. The input and output formats must match. If a JSON request is posted, a JSON response must be accepted, and likewise for XML.
      tags:
        - Datasources
      parameters:
        - name: useSavedReport
          description: Specifies whether to find the source (or input) report as a permanent resource. If true, the input transform must contain the URI of a saved report resource that contains the input BIRD content. The default is false, meaning that the input report content is in the transform in the request body.
          required: false
          in: query
          schema:
            type: boolean
            default: false
        - name: saveResult
          in: query
          description: Determines whether the transformed report is saved to the repository. If false, the transformed report is returned to the client as part of the body. If true, the BIRD content is not returned directly in the body of the response, but is saved in the repository as a report resource. The vnd.sas.report.transform in the response body contains links to retrieve the resulting resource.
          required: false
          schema:
            type: boolean
            default: false
        - name: failOnDataSourceError
          in: query
          required: false
          description: When the replacement data source is tested for compatibility and serious errors occur, the service can either fail and return, or it can attempt to continue. This parameter can be used to force a change even if there are errors.
          schema:
            type: boolean
            default: true
        - name: validate
          in: query
          required: false
          description: Determine whether the report content should be validated against the XML schema. Defaults to true. Schema validation errors do not necessarily halt processing. Errors are reported in the transform's errorMessages list.
          schema:
            type: boolean
            default: true
      requestBody:
        content:
          application/vnd.sas.report.transform+json:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              Data mapped request:
                $ref: "#/components/examples/dataMappedReportRequest"
          application/vnd.sas.report.transform+xml:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              Data mapped request:
                $ref: "#/components/examples/dataMappedReportRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              Data mapped request:
                $ref: "#/components/examples/dataMappedReportRequest"
          application/xml:
            schema:
              $ref: "#/components/schemas/transform"
            examples:
              Data mapped request:
                $ref: "#/components/examples/dataMappedReportRequest"
        description: The body of the request contains the input transform and the report content (or reference to the report) on which data mapping is performed.
        required: true
      responses:
        "201":
          description: Successful transformation. The resulting transform was "created" and returned.
          headers:
            Content-Type:
              description: The application/vnd.sas.report.transform response contains the BIRD report in its `reportContent` property. If saveResult is true, the savedReportResource property of the transform contains the URI for the application/vnd.sas.report resource that was saved.
              schema:
                type: string
            ETag:
              description: Identifier for preconditions of the saved report, when saveReport was specified.
              schema:
                type: string
            Last-Modified:
              description: Date and time when the resulting report was saved.
              schema:
                type: string
            Location:
              description: Location of created report resource, if saved. Also contained in the links of the response transform.
              schema:
                type: string
          content:
            application/vnd.sas.report.transform+json:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Data mapped response:
                  $ref: "#/components/examples/dataMappedReportResponse"
            application/vnd.sas.report.transform+xml:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Data mapped response:
                  $ref: "#/components/examples/dataMappedReportResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Data mapped response:
                  $ref: "#/components/examples/dataMappedReportResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/transform"
              examples:
                Data mapped response:
                  $ref: "#/components/examples/dataMappedReportResponse"
        "400":
          $ref: "#/components/responses/badTransformRequestJsonXml"
        "409":
          $ref: "#/components/responses/transformConflictError"
        "415":
          description: The media types and formats for the request and response should match (JSON or XML).
          headers:
            Content-Type:
              schema:
                type: string
            Location:
              description: Not generally set on this error.
              schema:
                type: string
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError415"
            application/vnd.sas.error+xml:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                bad request response:
                  $ref: "#/components/examples/badRequestError415"
  "/dataMappedReports/{reportId}":
