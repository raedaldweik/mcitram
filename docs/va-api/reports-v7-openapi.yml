components:
  headers:
    Location:
      description: The URI of the newly created resource.
      schema:
        type: string
    ETag:
      description: A tag that identifies this revision of the resource.
      schema:
        type: string
    Last-Modified:
      description: The last `modifiedTimeStamp` of the resource.
      schema:
        type: string
    Content-Language:
      description: This header represents the locale of the result. It may not be present if there is issue during localization, in which case the result is what is persisted.
      schema:
        type: string
  responses:
    Redirect304:
      description: The caller has the most current resource.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Last-Modified:
          $ref: "#/components/headers/Last-Modified"
  schemas:
    reportApi:
      title: API
      description: The list of links to top-level resources and operations available from the root of the API.
      x-sas-media-type:
        name: application/vnd.sas.api
        version: 1
      allOf:
        - $ref: "#/components/schemas/api"
      example:
        version: "1"
        links:
          - method: GET
            rel: reports
            href: /reports/reports
            uri: /reports/reports
            type: application/vnd.sas.collection
            itemType: application/vnd.sas.summary+json
          - method: POST
            rel: createReport
            href: /reports/reports
            uri: /reports/reports
            type: application/vnd.sas.report
            responseType: application/vnd.sas.report
          - method: POST
            rel: validateName
            href: /reports/validations/name
            uri: /reports/validations/name
          - method: POST
            rel: validateContent
            href: /reports/content/validation
            uri: /reports/content/validation
            type: application/vnd.sas.report.content
            responseType: application/vnd.sas.report.content.validation
    reportCollection:
      title: Report Collection
      description: A collection of reports.
      x-sas-media-type:
        name: application/vnd.sas.collection
        version: 2
      allOf:
        - $ref: "#/components/schemas/baseCollection2"
        - type: object
          properties:
            items:
              type: array
              description: The array of report representations.
              items:
                $ref: "#/components/schemas/report"
    report:
      title: Report
      description: The representation of a report. This representation is version 1.  Optional `version=1` parameter is the only `version` parameter that can be included.
      x-sas-media-type:
        name: application/vnd.sas.report
        version: 1
      type: object
      required:
        - name
      properties:
        id:
          type: string
          format: object-id
          description: unique identifier of the report
          example: f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
        name:
          type: string
          description: name of the report
          example: Sample Report
        description:
          type: string
          description: description of the report.
          example: Description of a sample report.
        creationTimeStamp:
          type: string
          format: date-time
          description: date and time when the report was created
        createdBy:
          type: string
          description: the user who created the report
          example: user1
        modifiedTimeStamp:
          type: string
          format: date-time
          description: date and time when the report was modified
        modifiedBy:
          type: string
          description: the user who modified the report
          example: user1
        links:
          type: array
          description: a set of links to related resources or operations
          items:
            $ref: "#/components/schemas/link"
          example:
            - method: GET
              rel: self
              href: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
              uri: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
              type: application/vnd.sas.report
            - method: GET
              rel: alternate
              href: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
              uri: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
              type: application/vnd.sas.summary
            - method: PUT
              rel: update
              href: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
              uri: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
              type: application/vnd.sas.report
              responseType: application/vnd.sas.report
            - method: PUT
              rel: updateContent
              href: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf/content
              uri: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf/content
              type: application/vnd.sas.report.content
              responseType: application/vnd.sas.report.content
        imageUris:
          type: object
          properties:
            icon:
              type: string
          required:
            - icon
          additionalProperties:
            type: string
          example:
            icon: /reports/icons/report.gif
        version:
          type: integer
          description: media type's schema version number
          example: 1
    newReport:
      title: New Report
      description: The representation of a report. This representation is version 1.  Optional `version=1` parameter is the only one that can be included.
      properties:
        name:
          type: string
          description: The localizable report name.
        description:
          type: string
          description: The localizable report description.
      example:
        name: TEST New Report
        description: TEST New Description
    reportSummary:
      title: Resource Summary
      description: The summarized representation of a resource. Often used in collection responses when more specific details aren't needed.
      x-sas-media-type:
        name: application/vnd.sas.summary
        version: 1
      allOf:
        - $ref: "#/components/schemas/summary"
      example:
        id: f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
        name: Sample Report
        createdBy: user1
        creationTimeStamp: 2020-12-09T13:22:11.394Z
        modifiedBy: user1
        modifiedTimeStamp: 2020-12-09T13:27:20.437Z
        links:
          - method: GET
            rel: self
            href: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
            uri: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
            type: application/vnd.sas.report
          - method: GET
            rel: alternate
            href: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
            uri: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
            type: application/vnd.sas.summary
          - method: DELETE
            rel: delete
            href: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
            uri: /reports/reports/f8b66d4b-d67a-4e4e-a66d-b6f06b1820bf
        type: report
        iconUri: /reports/icons/report.gif
        version: "1"
    updateReport:
      title: Update Report
      description: The representation of a report. This representation is version 1.  Optional `version=1` parameter is the only one that can be included.
      properties:
        id:
          type: string
          format: object-id
          description: Report id.
        name:
          type: string
          description: The localizable report name.
        description:
          type: string
          description: The localizable report description.
      example:
        id: 4eb3b675-e107-4857-a8f4-51aa555ac7e7
        name: TEST Update Report
        description: TEST New Description
    reportContentJson:
      title: Report Content JSON
      description: The representation of a report content in JSON format. Check [`Get Versions`](#/ReportContent/getReportContentVersions) and [`GET /versions/@defaultVersion`](#/ReportContent/getDefaultReportContentVersion) for the set of valid media types and versions as defined by `Business Intelligence Report Definition`.  If not provided, for request the version equivalent to the report content schema is used and for response latest version is used.
      x-sas-media-type:
        name: application/vnd.sas.report.content
        version: 1
      type: object
      example:
        "@element": SASReport
        xmlns: http://www.sas.com/sasreportmodel/bird-4.3.0
        label: Small Report
        dateCreated: 2020-10-24T01:33:24Z
        dateModified: 2020-11-04T03:20:00Z
        view:
          "@element": View
          sections:
            - "@element": Section
              name: vi1
              label: Section1
              body:
                "@element": Body
                mediaContainerList:
                  - "@element": MediaContainer
                    target: mt111
                    layout:
                      "@element": ResponsiveLayout
              mediaSchemes:
                - "@element": MediaScheme
                  name: ms201
              mediaTargets:
                - "@element": MediaTarget
                  name: mt111
                  scheme": ms201
    reportContentXml:
      title: Report Content XML
      description: The representation of a report content in XML format. Check [`Get Versions`](#/ReportContent/getReportContentVersions) and [`GET /versions/@defaultVersion`](#/ReportContent/getDefaultReportContentVersion) for the set of valid media types and versions as defined by `Business Intelligence Report Definition`.  If not provided, for request the version equivalent to the report content schema is used and for response latest version is used.<br> <i>The schema of this XML example is just for the example and therefore is only a very small subset of `Business Intelligence Report Definition`</i>
      x-sas-media-type:
        name: application/vnd.sas.report.content
        version: 1
      type: object
      xml:
        name: SASReport
        namespace: http://www.sas.com/sasreportmodel/bird-4.3.0
      properties:
        label:
          type: string
          example: Small Report
          xml:
            attribute: true
        dateCreated:
          type: string
          example: 2020-10-24T01:33:24Z
          xml:
            attribute: true
        dateModified:
          type: string
          example: 2020-11-04T03:20:00Z
          xml:
            attribute: true
        Results:
          type: object
        DataDefinitions:
          type: object
        VisualElements:
          type: object
        PromptDefinitions:
          type: object
        View:
          type: object
          properties:
            Sections:
              type: object
              properties:
                Section:
                  type: object
                  properties:
                    name:
                      xml:
                        attribute: true
                      example: vi1
                    label:
                      xml:
                        attribute: true
                      example: Section1
                    Body:
                      type: object
                      properties:
                        MediaContainer:
                          type: object
                          properties:
                            target:
                              xml:
                                attribute: true
                              example: mt111
                            RelativeLayout:
                              type: object
        Interactions:
          type: object
        MediaDefinitionResource:
          type: object
          properties:
            file:
              xml:
                attribute: true
              example: /files/files/0499563b-9425-42ab-b6e2-d99804e54299
        MediaSchemes:
          type: object
          properties:
            MediaScheme:
              type: object
              properties:
                name:
                  xml:
                    attribute: true
                  example: ms201
        MediaTargets:
          type: object
          properties:
            MediaTarget:
              type: object
              properties:
                name:
                  xml:
                    attribute: true
                  example: mt111
                scheme:
                  xml:
                    attribute: true
                  example: ms201
                definition:
                  xml:
                    attribute: true
                  example: table-1280x768
    reportVersionCollection:
      title: Report Version Collection
      description: A collection of report versions.
      x-sas-media-type:
        name: application/vnd.sas.collection
        version: 2
      allOf:
        - $ref: "#/components/schemas/baseCollection2"
        - type: object
          properties:
            items:
              type: array
              description: The array of report versions.
              items:
                $ref: "#/components/schemas/reportVersion"
      example:
        links:
          - method: GET
            rel: collection
            href: /reports/versions
            uri: /reports/versions
            type: application/vnd.sas.collection
          - method: GET
            rel: self
            href: /reports/versions?sortBy=name&start=0&limit=20
            uri: /reports/versions?sortBy=name&start=0&limit=20
            type: application/vnd.sas.collection
        name: report-versions
        accept: application/vnd.sas.report.version
        start: "0"
        count: "2"
        items:
          - schema: 4.0.2
            mediaType: "1"
            version: "1"
          - schema: 4.4.0
            mediaType: "9"
            version: "1"
        limit: "20"
        version: "2"
    reportVersion:
      title: Report Version
      description: The representation of a report version.
      x-sas-media-type:
        name: application/vnd.sas.report.version
        version: 1
      required:
        - schema
        - mediaType
        - version
      properties:
        schema:
          type: string
          description: The major.minor.patch of this report version representation.
          example: 4.3.0
        mediaType:
          type: integer
          description: The media type version of the report version representation.
          example: 8
        version:
          type: integer
          description: The version number of the report version representation. This representation is version 1.
          example: 1
    reportContentValidation:
      title: Report Content Validation
      description: The representation of a report content validation.
      x-sas-media-type:
        name: application/vnd.sas.report.content.validation
        version: 1
      type: object
      required:
        - level
        - schema
      properties:
        level:
          type: string
          description: The level of the report content validation.  Valid values are `schemaInvalid` and `schemaValid`.
          example: schemaInvalid
        schema:
          type: string
          description: The schema used for the report content validation.
          example: bird-4.1.2.xsd
        messages:
          type: array
          description: The messages generated for the report content validation.
          items:
            properties:
              type:
                type: string
                description: The type of validation error. Valid values are `schemaFatal` and `schemaError`.
              message:
                type: string
                description: The message of validation error.
          example:
            - type: schemaError
              message: "Line 89: Value 'binder' is not facet-valid with respect to enumeration '[column, page]'. It must be a value from the enumeration."
            - type: schemaError
              message: "Line 89: The value 'binder' of attribute 'type' on element 'Axis' is not valid with respect to its type, 'relationalAxisTypeEnum'."
        version:
