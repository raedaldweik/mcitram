openapi: 3.0.3
info:
  version: "7"
  title: Reports
  description: >
    You can use the Reports API to create, read, and update reports. This API enables basic tasks such as moving or renaming reports, as well as editorial tasks such as reading, writing, and updating report content.
  termsOfService: https://www.sas.com/en_us/legal/copyright.html
  contact:
    name: SAS Developers
    url: https://developer.sas.com
    email: devex@sas.com
servers:
  - url: http://example.com/reports
    description: The reports API server.
tags:
  - name: Root
    description: The list of Reports service links.
  - name: Report
    description: The operations for the report resource.
  - name: ReportContent
    description: The operations for the report content resource.
  - name: ReportState
    description: The operations for the report state resource.
  - name: ReportStateContent
    description: The operations for the report state content resource.
paths:
  /:
    head:
      summary: Get header information for the service
      description: Retrieves header information for the service. It can also be used to verify that the service is available.
      operationId: headersForRoot
      tags:
        - Root
      responses:
        "200":
          description: Service is running.
          headers:
            Content-Type:
              description: The content type of the response, `application/vnd.sas.api+json`.
              schema:
                type: string
        "404":
          description: Service is not available.
    get:
      summary: Get a collection of top-level links
      description: Returns a collection of links to the top-level collections surfaced through this API.
      operationId: root
      tags:
        - Root
      responses:
        "200":
          description: Top-level links.
          headers:
            Content-Type:
              description: The content type of the response, `application/vnd.sas.api+json`.
              schema:
                type: string
          content:
            application/vnd.sas.api+json:
              schema:
                $ref: "#/components/schemas/reportApi"
            application/json:
              schema:
                $ref: "#/components/schemas/reportApi"
        "404":
          description: Service is not available.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportServiceNotFound"
  /reports#reports:
    get:
      summary: Get a collection of reports
      description: Returns a collection of reports with standard paging, filtering, and sorting options.
      operationId: getReports
      tags:
        - Report
      parameters:
        - name: Accept-Item
          description: Optional, media type of collection item.
          in: header
          required: false
          schema:
            type: string
            enum:
              - application/vnd.sas.summary+json
              - application/vnd.sas.report+json
            default: application/vnd.sas.summary+json
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/Limit"
        - name: filter
          in: query
          description: The criteria for filtering. Report attributes that can be used are `id`, `name`, `description`, `createdBy`, `creationTimeStamp`, `modifiedBy`, and `modifiedTimeStamp`. See [`Filtering in REST APIs`](https://developer.sas.com/rest-apis/reports-v7/docs/getting-started/usage-notes#filtering).
          required: false
          schema:
            type: string
            format: filter-criteria
        - name: sortBy
          in: query
          description: The criteria for sorting. Report attributes that can be used are `id`, `name`, `description`, `createdBy`, `creationTimeStamp`, `modifiedBy`, and `modifiedTimeStamp`. See [`Sorting in REST APIs`](https://developer.sas.com/rest-apis/reports-v7/docs/getting-started/usage-notes#sorting).
          required: false
          schema:
            type: string
            format: sort-criteria
      responses:
        "200":
          description: The reports in resource summary format.
          content:
            application/vnd.sas.collection+json:
              schema:
                $ref: "#/components/schemas/reportCollection"
              examples:
                reports-collection:
                  $ref: "#/components/examples/ReportCollection.v1"
                report-summaries-collection:
                  $ref: "#/components/examples/ReportSummaryCollection.v1"
            application/json:
              schema:
                $ref: "#/components/schemas/reportCollection"
              examples:
                reports-collection:
                  $ref: "#/components/examples/ReportCollection.v1"
                report-summaries-collection:
                  $ref: "#/components/examples/ReportSummaryCollection.v1"
        "404":
          description: Reports collection not found, possibly due to incorrect URI or media type.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  summary: Not found error
                  value:
                    errorCode: 404
                    message: Not Found
                    details:
                      - "traceId: 85b7763697b4ba63"
                      - "path: /reports/reports"
                    version: 2
                    httpStatusCode: 404
  /reports:
    post:
      summary: Create report
      description: Creates a new report and adds it to a folder as a child.
      operationId: createReport
      tags:
        - Report
      parameters:
        - $ref: "#/components/parameters/ParentFolderUri"
      requestBody:
        $ref: "#/components/requestBodies/NewReport"
      responses:
        "201":
          description: New report created.  Use the `updateContent` link in the new report to store the report content. `ETag` header is returned. See [`Conditional Operations`](https://developer.sas.com/rest-apis/reports-v7/docs/getting-started/usage-notes#conditional-operations).
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
          content:
            application/vnd.sas.report+json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
            application/json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
        "400":
          description: The input report is invalid, or the `parentFolderUri` is not a valid folder URI or is not found.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  summary: Bad request error
                  value:
                    errorCode: 10736
                    message: An error occurred. The resource could not be added as a folder member because the specified folder URI cannot be found.
                    details:
                      - "traceId: 03b5f0c710eca2d6"
                      - "path: /reports/reports"
                    version: 2
                    httpStatusCode: 400
        "409":
          description: A report with the same name is already a member of the folder.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  summary: Conflict error
                  value:
                    errorCode: 10708
                    message: An error occurred. A conflict occurred when adding the resource as a member to the folder.
                    details:
                      - "traceId: 23307dd5dead24fc"
                      - "path: /reports/reports"
                    version: 2
                    httpStatusCode: 409
  "/reports/{reportId}#standard":
    head:
      summary: Check report status
      description: Returns the headers for a report, including `ETag`.  See [`Conditional Operations`](https://developer.sas.com/rest-apis/reports-v7/docs/getting-started/usage-notes#conditional-operations).
      operationId: headersForGetReport
      tags:
        - Report
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/IfModifiedSince"
      responses:
        "200":
          description: Check status operation is successful.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
        "404":
          description: Report does not exist.
    get:
      summary: Get a report
      description: Returns the specified report, including `ETag` header.  See [`Conditional Operations`](https://developer.sas.com/rest-apis/reports-v7/docs/getting-started/usage-notes#conditional-operations).
      operationId: getReport
      tags:
        - Report
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/IfModifiedSince"
      responses:
        "200":
          description: Returned the report and `ETag` header.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
          content:
            application/vnd.sas.report+json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
            application/json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
        "404":
          description: Report does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportNotFound"
  "/reports/{reportId}#resourceSummary":
    head:
      summary: Check report resource summary status
      description: Returns the headers for a report resource summary, including `modifiedTimeStamp`.
      operationId: headersForGetReportResourceSummary
      tags:
        - Report
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Check status operation is successful.
          headers:
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
        "404":
          description: Report resource summary does not exist.
    get:
      summary: Get resource summary report
      description: Returns the specified report in resource summary format.
      operationId: getReportAsResourceSummary
      tags:
        - Report
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Returns the report in resource summary format.
          headers:
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
          content:
            application/vnd.sas.summary+json:
              schema:
                $ref: "#/components/schemas/reportSummary"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
        "404":
          description: Report resource summary does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportNotFound"
  "/reports/{reportId}":
    delete:
      summary: Delete a report
      description: Deletes the specified report and its content. Remove the report from the parent folder.
      operationId: deleteReport
      tags:
        - Report
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "204":
          description: Report is deleted.
        "404":
          description: Report does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportNotFound"
    put:
      summary: Update a report
      description: Updates the specified report. Requires an `If-Match` or `If-Unmodified-Since` request header.  See [`Conditional Operations`](https://developer.sas.com/rest-apis/reports-v7/docs/getting-started/usage-notes#conditional-operations).
      operationId: updateReport
      tags:
        - Report
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IfUnmodifiedSince"
      requestBody:
        $ref: "#/components/requestBodies/UpdateReport"
      responses:
        "200":
          description: Report was updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
          content:
            application/vnd.sas.report+json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
            application/json:
              schema:
                $ref: "#/components/schemas/report"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
        "400":
          description: The input report was not valid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  summary: Bad request error
                  value:
                    errorCode": 400
                    message: An error occurred. The report could not be updated due to bad content.
                    details:
                      - "traceId: 47a466b8c6c9e386"
                      - "path: /reports/reports/4eb3b675-e107-4857-a8f4-51aa555ac7e7"
                    version: 2
                    httpStatusCode: 400
        "404":
          description: Report does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportNotFound"
        "412":
          description: The `If-Match` or `If-Unmodified-Since` header did not match the current version of the resource.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportETagNotMatched"
        "428":
          description: The `If-Match` or `If-Unmodified-Since` was not provided when updating the report.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportETagMissing"
  "/reports/{reportId}/content":
    head:
      summary: Check status of report content
      description: Returns the headers for report content, including the `ETag`.  See [`Conditional Operations`](https://developer.sas.com/rest-apis/reports-v7/docs/getting-started/usage-notes#conditional-operations).
      operationId: headersForGetContent
      tags:
        - ReportContent
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/IfModifiedSince"
      responses:
        "200":
          description: Check status operation was successful.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
            Content-Language:
              $ref: "#/components/headers/Content-Language"
        "304":
          $ref: "#/components/responses/Redirect304"
        "404":
          description: Report or report content does not exist.
    get:
      summary: Get report content
      description: Returns the report content, including `ETag`.  See [`Conditional Operations`](https://developer.sas.com/rest-apis/reports-v7/docs/getting-started/usage-notes#conditional-operations).
      operationId: getContent
      tags:
        - ReportContent
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/IfModifiedSince"
      responses:
        "200":
          description: Report content.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
            Content-Language:
              $ref: "#/components/headers/Content-Language"
          content:
            application/vnd.sas.report.content+json:
              schema:
                $ref: "#/components/schemas/reportContentJson"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
            application/vnd.sas.report.content+xml:
              schema:
                $ref: "#/components/schemas/reportContentXml"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
        "304":
          $ref: "#/components/responses/Redirect304"
        "404":
          description: Report or report content does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportContentNotFound"
    put:
      summary: Save report content
      description: Saves the report content. Does not return the stored content. An `ETag` is not required for the initial save, but is required for all subsequent saves. In some situations, where an Accept type header is automatically generated, setting it to '\*/\*' will achieve the same effect as omitting it. See [`Conditional Operations`](https://developer.sas.com/rest-apis/reports-v7/docs/getting-started/usage-notes#conditional-operations).
      operationId: updateContent
      tags:
        - ReportContent
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IfUnmodifiedSince"
        - name: copyDependentFiles
          in: query
          required: false
          description: The flag to create copy of all dependent file resources.
          schema:
            type: boolean
      requestBody:
        $ref: "#/components/requestBodies/AllFormat"
      responses:
        "204":
          description: The report content was stored.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
        "400":
          description: The input report content was not valid.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
        "404":
          description: The report or report content does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportContentNotFound"
        "412":
          description: The `If-Match` or `If-Unmodified-Since` header did not match the current version of the resource.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportContentETagNotMatched"
        "428":
          description: The `If-Match` or `If-Unmodified-Since` was not provided when updating the report content.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportContentETagMissing"
  "/reports/{reportId}/content#updateContentWithReturn":
    put:
      summary: Save and return report content
      description: An `ETag` is not required for the initial save, but is required for all subsequent saves. See [`Conditional Operations`](https://developer.sas.com/rest-apis/reports-v7/docs/getting-started/usage-notes#conditional-operations). A different response code is returned depending on whether the request is for the initial save or a subsequent save.
      operationId: updateContentWithReturn
      tags:
        - ReportContent
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IfUnmodifiedSince"
        - name: copyDependentFiles
          in: query
          required: false
          description: The flag to create copy of all dependent file resources.
          schema:
            type: boolean
      requestBody:
        $ref: "#/components/requestBodies/AllFormat"
      responses:
        "200":
          description: The report content was updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
          content:
            application/vnd.sas.report.content+json:
              schema:
                $ref: "#/components/schemas/reportContentJson"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
            application/vnd.sas.report.content+xml:
              schema:
                $ref: "#/components/schemas/reportContentXml"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
        "201":
          description: The report content was created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
          content:
            application/vnd.sas.report.content+json:
              schema:
                $ref: "#/components/schemas/reportContentJson"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
            application/vnd.sas.report.content+xml:
              schema:
                $ref: "#/components/schemas/reportContentXml"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
        "400":
          description: Report does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/BadReportContent"
        "404":
          description: Report or report content does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportContentNotFound"
        "412":
          description: The `If-Match` or `If-Unmodified-Since` header did not match the current version of the object.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportContentETagNotMatched"
        "428":
          description: The `If-Match` or `If-Unmodified-Since` was not provided when updating the report.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportContentETagMissing"
  "/reports/{reportId}/content/version":
    head:
      summary: Check persisted report content version
      description: Returns whether the persisted report content version exists
      operationId: headersForGetContentVersion
      tags:
        - ReportContent
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: The persisted report content version exists.
        "404":
          description: Report, report content does not exist, or, the content version cannot be determined.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportContentNotFound"
    get:
      summary: Get persisted report content version
      description: Returns the persisted report content version.
      operationId: getContentVersion
      tags:
        - ReportContent
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: The persisted report content version.
          content:
            application/vnd.sas.report.version+json:
              schema:
                $ref: "#/components/schemas/reportVersion"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
            application/json:
              schema:
                $ref: "#/components/schemas/reportVersion"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
        "404":
          description: Report, report content does not exist, or, the content version cannot be determined.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  $ref: "#/components/examples/ReportContentNotFound"
  "/reports/{reportId}/content/validation#validatePersistedContent":
    post:
      summary: Validate the persisted report content schema
      description: Validates the report content against a schema. The schema specified in the report content is used for validation.
      operationId: createPersistedContentValidation
      tags:
        - ReportContent
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Report content is valid.
          content:
            application/vnd.sas.report.content.validation+json:
              schema:
                $ref: "#/components/schemas/reportContentValidation"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
            application/json:
              schema:
                $ref: "#/components/schemas/reportContentValidation"
              examples:
                ReportCreated:
                  $ref: "#/components/examples/ReportCreated"
        "404":
          description: Report or report content does not exist.
          content:
            application/vnd.sas.error+json:
              schema:
                $ref: "#/components/schemas/error2"
              examples:
                error:
                  summary: Not found error
                  value:
                    errorCode: 0
                    message: "An error occurred. The resource could not be found. Identifier: 5559a118-139b-46e4-adea-97198d9068f5."
                    details:
                      - "traceId: 1e2ce9a76a5e0a14"
                      - "path: /reports/reports/5559a118-139b-46e4-adea-97198d9068f5/content/validation"
                    version: 2
                    httpStatusCode: 404
  /versions:
    get:
      summary: Get available versions of report content
      description: Return all available versions of report content.
      operationId: getReportContentVersions
      tags:
        - ReportContent
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/Limit"
        - name: filter
          in: query
          description: The criteria for filtering. Report version attributes that can be used are `schema`, `mediaType`, and `version`. See [Filtering in REST APIs](https://developer.sas.com/rest-apis/reports-v7/docs/getting-started/usage-notes#filtering).
          required: false
          schema:
            type: string
            format: filter-criteria
        - name: sortBy
          in: query
          description: The criteria for sorting. Report version attributes that can be used are `schema`, `mediaType`, and `version`. See [Sorting in REST APIs](https://developer.sas.com/rest-apis/reports-v7/docs/getting-started/usage-notes#sorting).
          required: false
          schema:
            type: string
            format: sort-criteria
      responses:
